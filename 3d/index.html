const MONS = [];

  if(u.faceY !== undefined){ let d = u.faceY - c.rotation.y; d = Math.atan2(Math.sin(d), Math.cos(d)); c.rotation.y += d * Math.min(1, dt*10); } }

/* ---------- 後製：柔光 ---------- */
const rt = new THREE.WebGLRenderTarget(innerWidth, innerHeight, {samples: MOBILE ? 2 : 4, type: THREE.HalfFloatType});
const composer = new EffectComposer(renderer, rt);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), .5, .5, .97); composer.addPass(bloom);
composer.addPass(new OutputPass());
addEventListener("resize", () => { camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight); });

/* ---------- 主迴圈 ---------- */
const clock3 = new THREE.Clock(); let acc = 0, started = false;
function loop(){
  const dt = Math.min(clock3.getDelta(), .05); acc += dt;
  if(started) stepMove(dt);
  animChar(me, dt); Object.values(CHARS).forEach(c => { const u = c.mesh.userData; if(u.path && u.path.length){ const tgt = u.path[0], d = new THREE.Vector3(tgt.x - c.mesh.position.x, 0, tgt.z - c.mesh.position.z), L = d.length(); if(L < .05){ u.path.shift(); if(!u.path.length){ u.walking = false; u.faceY = u.endFace; const p = c.mesh.position; OBST[c.ob] = [p.x-.275, p.z-.275, p.x+.275, p.z+.275]; } } else { d.setLength(Math.min(L, 2.2*dt)); c.mesh.position.add(d); u.walking = true; u.faceY = Math.atan2(d.x, d.z); } } animChar(c.mesh, dt); });
  if(!window.__close) controls.target.lerp(new THREE.Vector3(me.position.x*.7, .8, me.position.z*.7), Math.min(1, dt*2.5)); controls.update();
  if(acc > .06){ drawMonitors(acc); acc = 0; if(Math.abs(dawnGoal - dawnT) > .004){ dawnT += Math.sign(dawnGoal - dawnT)*.006; setDawn(dawnT); } }
  const p = dust.geometry.attributes.position; for(let i=0;i<dustN;i++){ p.array[i*3+1] += Math.sin(clock3.elapsedTime*.4 + i)*.0008 + .0006; if(p.array[i*3+1] > 2.7) p.array[i*3+1] = 0; } p.needsUpdate = true;
  if(ring.material.opacity > 0){ ring.material.opacity -= dt*1.2; ring.scale.multiplyScalar(1 + dt*1.5); }
  composer.render(); placeTags();
  requestAnimationFrame(loop);
}
drawClock(); setInterval(drawClock, 1000); drawMonitors(0); loop();
document.getElementById("go").onclick = () => { document.getElementById("start").classList.add("out"); started = true; setGoal(); bgm.play().then(() => { muteBtn.textContent = "♪ 音樂開"; }).catch(()=>{}); };
window.__pgy3d = {closeup(){ const xs = {me:-1.2, kui:-.4, zhang:.4, rn:1.2}; Object.entries(xs).forEach(([k,x]) => { const m = k === 'me' ? me : CHARS[k].mesh; m.position.set(x+1,0,2.2); m.rotation.y = 0; m.userData.faceY = 0; }); controls.target.set(1,1,2.2); camera.position.set(1,1.5,5.4); controls.minDistance = 1; controls.update(); started = false; window.__close = 1; }, talk, CHARS, me, STORY, setDawn, get step(){ return stepI; }};
</script>
