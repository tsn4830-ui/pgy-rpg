<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="臺灣 PGY 兩年訓練的角色扮演遊戲，每題附參考文獻。"></head><body>

<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700;900&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: a quiet "life simulator" console — header + control bar on top, the story card on the left,
   status / 人生地圖 (1 格 = 1 個月) / 工時曲線 / 訓練紀錄 panels on the right; stacks on phones. */
:root{
  --bg:#eef1ef;
  --surface:#ffffff;
  --surface-2:#f4f6f5;
  --ink:#1b2a2e;
  --muted:#5d6d70;
  --faint:#9aa8a8;
  --line:#d5dddb;
  --drape:#2c6e5c;
  --drape-ink:#ffffff;
  --stamp:#b42318;
  --ok:#2f7d4a;
  --warn:#a86512;
  --empty:#dfe5e3;
  --f-display:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-mono:"JetBrains Mono","SFMono-Regular",Consolas,monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1517;--surface:#161f22;--surface-2:#1b262a;--ink:#e3ebe8;--muted:#9fb1ad;--faint:#5f7270;--line:#2a393d;
  --drape:#63b59c;--drape-ink:#0b1513;--stamp:#ff7a6b;--ok:#6fcf8e;--warn:#e9b25a;--empty:#243236;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1517;--surface:#161f22;--surface-2:#1b262a;--ink:#e3ebe8;--muted:#9fb1ad;--faint:#5f7270;--line:#2a393d;
  --drape:#63b59c;--drape-ink:#0b1513;--stamp:#ff7a6b;--ok:#6fcf8e;--warn:#e9b25a;--empty:#243236;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.7;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 40px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.3}
h3{font-size:16px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--drape);outline-offset:2px}
a{color:var(--drape)}
.app{max-width:1180px;margin:0 auto;display:grid;gap:12px}
/* header */
.top{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px}
.top h1{font-size:22px;font-weight:900}
.ver{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.top .links{margin-left:auto;display:flex;gap:12px;flex-wrap:wrap;font-size:13px}
/* control bar */
.ctrl{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.ctrl button{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 12px;font-size:13px;white-space:nowrap}
.ctrl button[aria-pressed="true"]{background:var(--drape);color:var(--drape-ink);border-color:var(--drape)}
.ctrl .sep{width:1px;height:18px;background:var(--line);margin:0 4px}
.waiting{font-size:13px;color:var(--stamp);font-weight:700;display:flex;align-items:center;gap:6px}
.waiting::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--stamp)}
@media (prefers-reduced-motion:no-preference){.waiting::before{animation:blink 1.4s ease-in-out infinite}@keyframes blink{50%{opacity:.25}}}
/* columns */
.cols{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:12px;align-items:start}
@media (max-width:900px){.cols{grid-template-columns:minmax(0,1fr)}}
.side{display:grid;gap:12px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:10px;min-width:0}
.panel-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.panel-h h3{font-family:var(--f-body);font-weight:700;font-size:14px;letter-spacing:.06em}
.hint{font-size:12px;color:var(--muted)}
/* status bars */
.stat{display:grid;grid-template-columns:5.2em 1fr 3.4em;align-items:center;gap:8px;font-size:13px;font-variant-numeric:tabular-nums}
.stat i{display:block;height:8px;border-radius:4px;background:var(--empty);overflow:hidden;position:relative}
.stat i b{position:absolute;inset:0 auto 0 0;border-radius:4px;background:var(--drape);transition:width .4s}
.stat.alert i b{background:var(--stamp)}
.stat em{font-style:normal;text-align:right;font-family:var(--f-mono);font-size:12px}
.where{font-size:13px;color:var(--muted)}
/* life map */
.map{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:4px}
.map div{aspect-ratio:1;border-radius:3px;background:var(--empty);max-width:100%}
.map div.now{outline:2px solid var(--ink);outline-offset:1px}
@media (prefers-reduced-motion:no-preference){.map div.now{animation:pulse 1.6s ease-in-out infinite}@keyframes pulse{50%{outline-color:transparent}}}
.legend{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:4px}
.legend span::before{content:"";width:9px;height:9px;border-radius:2px;background:var(--c)}
/* curve */
.curve svg{width:100%;height:auto;display:block}
.curve text{font-family:var(--f-mono);font-size:10px;fill:var(--muted)}
/* log */
.log{list-style:none;margin:0;padding:0;display:grid;gap:2px;max-height:320px;overflow:auto}
.log li button{width:100%;text-align:left;background:none;border:0;border-radius:6px;padding:4px 6px;display:grid;grid-template-columns:4.8em 1fr 1.2em;gap:6px;font-size:13px;line-height:1.5}
.log li button:hover{background:var(--surface-2)}
.log .when{font-family:var(--f-mono);font-size:11px;color:var(--faint);padding-top:2px}
.log .star{color:var(--warn)}
/* story card */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:grid;gap:14px;min-width:0}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
.speaker{display:flex;gap:12px;align-items:flex-start}
.av{flex:0 0 auto;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:900;font-size:19px;color:#fff}
.who{font-weight:700}
.who small{font-weight:400;color:var(--muted);margin-left:6px;font-size:13px}
.says{white-space:pre-line;min-width:0}
.opts{display:grid;gap:8px}
.opt{text-align:left;border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:10px 14px;line-height:1.5}
.opt:hover{border-color:var(--drape)}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--surface))}
.opt.wrong{border-color:var(--stamp);background:color-mix(in srgb,var(--stamp) 12%,var(--surface))}
.opt:disabled{cursor:default}
.primary{justify-self:start;background:var(--drape);color:var(--drape-ink);border:0;border-radius:8px;padding:10px 22px;font-weight:700}
.ghost{background:none;border:1px solid var(--line);border-radius:8px;padding:8px 16px}
.feedback{border-left:4px solid var(--drape);background:var(--surface-2);padding:12px 14px;border-radius:0 8px 8px 0;display:grid;gap:6px}
.feedback.bad{border-left-color:var(--stamp)}
.src{font-size:13px;color:var(--muted)}
.study{font-size:13px;display:flex;flex-wrap:wrap;gap:4px 12px}
.ref{font-family:var(--f-mono);font-size:12px;vertical-align:super;text-decoration:none}
.stamp{display:inline-block;justify-self:start;font-family:var(--f-display);font-weight:900;color:var(--stamp);border:2px solid var(--stamp);padding:0 8px;border-radius:4px;transform:rotate(-4deg);letter-spacing:.1em}
.stamp.ok{color:var(--ok);border-color:var(--ok)}
.fx{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.banner{display:grid;gap:4px;border-bottom:1px dashed var(--line);padding-bottom:12px}
.banner h2{font-size:clamp(22px,4.5vw,30px)}
.meta{font-size:14px;color:var(--muted)}
.hero{display:grid;gap:12px}
.hero h1{font-size:clamp(34px,8vw,54px);font-weight:900}
.hero h1 span{color:var(--drape)}
.hero p{margin:0;max-width:62ch}
.field{display:grid;gap:4px}
.field input,.field textarea{font:inherit;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);color:var(--ink);max-width:420px;width:100%}
.ads{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.ad{border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:8px;align-content:start;background:var(--surface-2);text-align:left}
.ad h3{font-size:18px}
.ad ul{margin:0;padding-left:1.2em;font-size:14px}
.ad .tag{font-family:var(--f-mono);font-size:12px;color:var(--drape);letter-spacing:.08em}
.ad:hover{border-color:var(--drape)}
.people{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.person{display:flex;gap:10px;border:1px solid var(--line);border-radius:var(--r);padding:12px;min-width:0}
.person p{margin:2px 0 0;font-size:14px}
.person .tag{font-size:12px;color:var(--muted)}
.hearts{font-family:var(--f-mono);font-size:12px;color:var(--drape)}
.kcard{border-top:1px solid var(--line);padding-top:10px;display:grid;gap:4px}
.kcard:first-of-type{border-top:0;padding-top:0}
.kcard h3{font-family:var(--f-body);font-size:15px}
.kcard p{margin:0;font-size:14px}
ol.refs{margin:0;padding-left:2.4em;display:grid;gap:6px;font-size:14px}
ol.refs li{padding-left:4px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.tablebox{overflow-x:auto}
.foot{font-size:12px;color:var(--muted);text-align:center;margin:0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
@media (prefers-reduced-motion:no-preference){.card.enter{animation:in .25s ease-out}@keyframes in{from{transform:translateY(6px)}to{transform:none}}}
.world{padding:0;overflow:hidden;background:#1b2427}#map{display:block;width:100%;height:auto;cursor:pointer;touch-action:manipulation}.gate{display:flex;gap:12px;align-items:center;margin:4px 0 12px}.gate .meta{display:block;margin-top:4px}img.pav{width:48px;height:48px;border-radius:10px;image-rendering:pixelated;flex:none}img.av.pav{width:44px;height:44px}
</style>

<div class="app">
  <header class="top">
    <h1>呆丸 PGY 物語</h1><span class="ver">◐ v5.0 測試版</span>
    <nav class="links" aria-label="讀書網站">
      <a href="https://pocket.drtsengshihting.com/" target="_blank" rel="noopener">2026 內科小手冊 ↗</a>
      <a href="https://guideline.drtsengshihting.com/" target="_blank" rel="noopener">內科指引索引 ↗</a>
      <a href="https://imreview.drtsengshihting.com/" target="_blank" rel="noopener">內科 Review Hub ↗</a>
      <a href="https://endoclass.drtsengshihting.com/" target="_blank" rel="noopener">內分泌代謝實證教室 ↗</a>

    </nav>
  </header>
  <div class="ctrl" id="ctrl">
    <button id="skip">跳到下一個決定 »</button>
    <button id="auto" aria-pressed="false">⋯ 自動播放</button>
    <button id="music" aria-pressed="false">♪ 音樂</button>
    <button id="theme">◐ 畫面明暗</button>
    <span class="sep" aria-hidden="true"></span>
    <button data-tab="game" aria-pressed="true">劇情</button>
    <button data-tab="people" aria-pressed="false">同事與團隊</button>
    <button data-tab="cards" aria-pressed="false">知識卡</button>

  <div class="cols">

    <aside class="side" id="side"></aside>

<script>
"use strict";
/* ======================= 角色 ======================= */
const CH = {
  me:    {n:"你", role:"PGY 醫師", col:"#2c6e5c"},
  hsu:   {n:"許哲維", role:"PGY 同梯", tag:"惹人厭的同事", col:"#6d4bb3",
          desc:"交班永遠一句「應該沒事吧」，搶功倒是很快。", twist:"其實很怕被人發現自己不會。學會 ISBAR 後交班變得最清楚的就是他。"},
  bai:   {n:"白芷晴", role:"PGY 同梯", tag:"惹人厭的同事", col:"#9a5a2a",
          desc:"群組已讀不回，雜事總能「剛好」落到別人頭上。", twist:"她同時在照顧生病的父親。說開之後，兩人一起排出公平的分工表。"},
  zhang: {n:"張雅筑", role:"內科 R3，後來升總醫師", tag:"可怕的學姊", col:"#a3342e",
          desc:"早上六點查房，一路問到你答不出來為止。", twist:"嚴格只針對病人安全。你被家屬罵時，第一個站出來的是她。"},
  ouyang:{n:"歐陽晉", role:"外科總醫師", tag:"可怕的學長", col:"#30506e",
          desc:"嗓門大、節奏快，交班漏一項就當場開罵。", twist:"PGY2 那年他請了三個月育嬰假，回來後說：「以前那樣罵人，是我錯了。」"},
  lin:   {n:"林振宏", role:"內科病房護理長", tag:"指手畫腳的護理長", col:"#4b6b2e",
          desc:"醫囑格式、手部衛生、給藥前確認……每一樣都要管。", twist:"他管的每一件事，背後都有一次差點出事的病人。"},
  kui:   {n:"陳葵（小葵）", role:"新手護理師", tag:"可愛的新人", col:"#c2557a",
          desc:"笑起來很甜，大家都叫她小葵。", twist:"可愛不等於好欺負：她給藥前一定雙重核對，擋下過你的錯誤醫囑。"},
  rui:   {n:"陳品睿", role:"急診資深護理師", tag:"男護理師", col:"#2a6f86",
          desc:"ACLS 指導員，急救室裡最冷靜的人。", twist:"被病人叫「男護士」時，他只淡淡回一句：「叫我護理師就好。」"},
  wang:  {n:"王宛如", role:"急診主治醫師", tag:"急診主治", col:"#7a3f8f", desc:"同時看十床也不提高音量。"},
  lee:   {n:"李國棟", role:"兒科主治醫師", tag:"兒科主治", col:"#c07a12", desc:"口袋裡永遠有貼紙，跟家長解釋可以講三十分鐘。"},
  tsai:  {n:"蔡文淵", role:"婦產科主治醫師", tag:"婦產科主治", col:"#8a3b5c", desc:"資深婦產科醫師，對病人隱私的要求一絲不苟。"},
  kolas: {n:"Kolas 主任", role:"東部衛生所主任", tag:"社區醫學導師", col:"#1f7a6a", desc:"阿美族，回到家鄉服務十五年，騎機車做居家訪視。"},
  shih:  {n:"施雨萱", role:"老年醫學科主治醫師", tag:"老年醫學主治", col:"#5b5ea6", desc:"會蹲下來跟坐輪椅的阿公平視說話。"},
  cheng: {n:"鄭宇安", role:"臨床藥師", tag:"臨床藥師", col:"#3f7f3a", desc:"在電話那頭幫你把劑量算第二遍。"},
  sys:   {n:"旁白", role:"", col:"#5a6b6f"},
  pager: {n:"呼叫器", role:"值班", col:"#b42318"}
};
const MET_ORDER = ["hsu","bai","zhang","ouyang","lin","kui","rui","wang","lee","tsai","kolas","shih","cheng"];

/* ======================= 題庫（每題附出處） ======================= */
const QB = {
 sepsis:{t:"敗血性休克的第一小時",q:"72 歲男性，發燒、BP 82/48 mmHg、乳酸 4.6 mmol/L，疑似肺炎。下一步最優先？",
  o:["抽血液培養後，1 小時內給予經驗性廣效抗生素，並開始晶體輸液（建議前 3 小時 30 mL/kg）","先安排胸部 CT 找到感染源再給抗生素","先給 dopamine 提升血壓，輸液可以晚一點","以白蛋白作為第一線復甦輸液"],a:0,
  e:"可能為敗血性休克時，建議 1 小時內給抗生素，給藥前盡量先抽血液培養但不可因此延誤。低血壓或乳酸 ≥4 時建議前 3 小時給 30 mL/kg 晶體輸液。升壓劑首選 norepinephrine，目標 MAP ≥65 mmHg；不建議以白蛋白做第一線。",
  s:"Surviving Sepsis Campaign 國際指引 2021（Evans L, et al. Crit Care Med 2021）"},
 hyperk:{t:"高血鉀伴心電圖變化",q:"慢性腎病病人，K 7.1 mEq/L，ECG 出現高尖 T 波與 QRS 變寬。第一步？",
  o:["靜脈注射 10% calcium gluconate 穩定心肌細胞膜","立刻口服 Kayexalate 後觀察","先給 furosemide 利尿","等血液透析排程"],a:0,
  e:"有心電圖變化時，先用鈣劑穩定心肌膜（不會降低血鉀），接著用 regular insulin 10 單位加葡萄糖把鉀移入細胞，再處理排除（利尿、結合劑、透析）。注射胰島素後要監測血糖。",
  s:"UK Kidney Association：Clinical Practice Guideline — Treatment of Acute Hyperkalaemia in Adults（2020）"},
 hypogly:{t:"意識不清的低血糖",q:"糖尿病病人意識不清，指尖血糖 38 mg/dL，已有靜脈管路、無法口服。處置？",
  o:["靜脈給予葡萄糖（如 50% 葡萄糖液），15 分鐘後再測血糖","先給 regular insulin","請病人喝果汁","先安排腦部 CT"],a:0,
  e:"血糖 <54 mg/dL 屬第 2 級低血糖。意識不清有靜脈管路：50% 葡萄糖常用 25 g（50 mL）；沒有管路：glucagon 1 mg 肌肉或皮下注射。清醒能吞嚥者口服 15–20 g 葡萄糖，15 分鐘後回測（15-15 法則）。任何一次 <70 mg/dL，隔天都要檢討並調整醫囑。",
  s:"ADA Standards of Care in Diabetes—2026，第 6、16 章"},
 hypona:{t:"低血鈉不能矯正太快",q:"慢性低血鈉 Na 112 mmol/L 的病人，矯正速度的重點是？",
  o:["24 小時內上升不超過約 8–10 mmol/L，以免滲透性去髓鞘症候群","越快越好，最好當天回到 135","只要病人沒症狀就不用監測","一律給 3% 鹽水直到正常"],a:0,
  e:"慢性低血鈉矯正過快可能造成滲透性去髓鞘症候群（ODS）。歐洲指引建議第一個 24 小時不超過 10 mmol/L、之後每 24 小時不超過 8；酗酒、營養不良、低血鉀等高風險者更保守。需密集追蹤血鈉。",
  s:"European Clinical Practice Guideline on Hyponatraemia（Spasovski G, et al. Eur J Endocrinol 2014）"},
 ugib:{t:"上消化道出血的輸血門檻",q:"上消化道出血、血行動力學穩定的病人，一般建議輸紅血球的 Hb 門檻？",
  o:["Hb < 7 g/dL（限制性輸血）","Hb < 10 g/dL","只要有出血就輸","Hb < 12 g/dL"],a:0,
  e:"隨機試驗顯示限制性輸血（Hb <7 g/dL）比寬鬆策略死亡率更低、再出血更少；有心血管疾病者門檻可稍高。另應盡早給 PPI 並於 24 小時內安排內視鏡。",
  s:"Villanueva C, et al. NEJM 2013；ACG Clinical Guideline: Upper GI and Ulcer Bleeding 2021"},
 kcl:{t:"KCl 是高警訊藥品",q:"病人 K 2.9 mEq/L，你開立 KCl 補充。正確給法？",
  o:["稀釋後以輸液幫浦緩慢靜脈滴注，周邊管路速率依院內規範（常見每小時不超過 10 mEq）","20 mEq 直接靜脈推注最快","不用稀釋，加在 IV 管路側管快速打完","肌肉注射"],a:0,
  e:"濃縮 KCl 是國際公認的高警訊藥品，靜脈推注可能致命性心律不整。務必稀釋、用幫浦控制速度、監測血鉀；能口服時優先口服。",
  s:"ISMP List of High-Alert Medications in Acute Care Settings"},
 dka:{t:"DKA 何時可以開始打胰島素",q:"DKA 病人，開始靜脈 insulin 之前，血鉀至少要多少？",
  o:["≥ 3.5 mEq/L（新版共識；舊版為 3.3）","≥ 2.0 mEq/L","不用管血鉀，越早打越好","≥ 6.0 mEq/L"],a:0,
  e:"胰島素會把鉀推進細胞，血鉀過低時先打可能誘發致命心律不整。2024 年 ADA/EASD 等共識建議 K <3.5 先補鉀、延後胰島素；舊版 2009 共識門檻為 3.3。",
  s:"Umpierrez GE, et al. Hyperglycemic Crises in Adults With Diabetes: A Consensus Report. Diabetes Care 2024"},
 curb:{t:"CURB-65",q:"下列哪一項「不是」社區型肺炎嚴重度 CURB-65 的評分項目？",
  o:["體溫 ≥ 38.5°C","意識混亂（Confusion）","呼吸速率 ≥ 30 次/分","年齡 ≥ 65 歲"],a:0,
  e:"CURB-65 = Confusion、Urea >7 mmol/L（BUN >19 mg/dL）、Respiratory rate ≥30、Blood pressure（SBP <90 或 DBP ≤60）、年齡 ≥65。體溫不在其中。",
  s:"Lim WS, et al. Thorax 2003"},
 hand:{t:"手部衛生五時機",q:"WHO 手部衛生五時機，不包括哪一個？",
  o:["寫完病歷之後","接觸病人前","執行清潔／無菌操作前","接觸病人周遭環境後"],a:0,
  e:"五時機：接觸病人前、執行清潔／無菌操作前、暴觸病人體液風險後、接觸病人後、接觸病人周遭環境後。",
  s:"WHO Guidelines on Hand Hygiene in Health Care（2009）"},
 checklist:{t:"手術安全查核",q:"WHO 手術安全查核表中的「Time Out」在什麼時候執行？",
  o:["劃刀前，全體團隊確認病人、術式、部位","麻醉誘導前","病人離開手術室前","術後回到病房時"],a:0,
  e:"三階段：Sign In（麻醉誘導前）、Time Out（劃刀前）、Sign Out（病人離開手術室前）。",
  s:"WHO Surgical Safety Checklist（2009）"},
 tension:{t:"張力性氣胸",q:"車禍病人呼吸窘迫、低血壓、患側呼吸音消失、頸靜脈怒張、氣管偏移。下一步？",
  o:["立即針頭減壓（成人建議第 4/5 肋間、腋中線前方），不需等 X 光","先照胸部 X 光確認","先插鼻胃管","先做 CT"],a:0,
  e:"張力性氣胸是臨床診斷，應立即減壓，再放置胸管。ATLS 第 10 版建議成人針頭減壓位置改為第 4/5 肋間、腋中線前方。",
  s:"ACS Advanced Trauma Life Support（ATLS）第 10 版，2018"},
 abx:{t:"預防性抗生素時機",q:"手術預防性抗生素（如 cefazolin）應在什麼時候給？",
  o:["劃刀前 60 分鐘內","術後回病房再給","前一天晚上","劃刀後 2 小時"],a:0,
  e:"一般在劃刀前 60 分鐘內給予（vancomycin、fluoroquinolone 為 120 分鐘內），手術時間長須依半衰期追加。",
  s:"Bratzler DW, et al. Clinical practice guidelines for antimicrobial prophylaxis in surgery. Am J Health-Syst Pharm 2013"},
 alvarado:{t:"Alvarado 評分",q:"下列哪一項「不是」急性闌尾炎 Alvarado 評分項目？",
  o:["血清澱粉酶升高","右下腹壓痛","轉移性右下腹痛","白血球增多"],a:0,
  e:"Alvarado（MANTRELS）：轉移痛、食慾不振、噁心嘔吐、右下腹壓痛、反彈痛、發燒、白血球增多、左移。澱粉酶不在內。",
  s:"Alvarado A. Ann Emerg Med 1986"},
 burn:{t:"燒燙傷輸液",q:"燒燙傷輸液公式中，前半量要在什麼時間內給完？",
  o:["從「受傷時間」起算 8 小時內","從到院時間起算 8 小時內","24 小時平均給","前 1 小時內"],a:0,
  e:"Parkland 公式 4 mL × 體重 × %TBSA（ATLS 第 10 版成人起始改為 2 mL），前半量於受傷後 8 小時內給，從受傷時間起算；再依尿量（成人 0.5 mL/kg/h）調整。",
  s:"ACS ATLS 第 10 版，2018"},
 needle:{t:"針扎之後",q:"你被用過的針頭扎到，第一步？",
  o:["立刻用肥皂與清水清洗傷口，並馬上通報，評估是否需暴露後預防","用力擠出血再消毒，下班再說","用漂白水浸泡傷口","等來源病人報告出來再決定要不要通報"],a:0,
  e:"以肥皂與清水清洗，不建議擠壓或用刺激性消毒劑。立即通報感控／職安單位，評估來源病人 HBV、HCV、HIV。若需 HIV 暴露後預防（PEP），越早越好，最好 2 小時內、不超過 72 小時。",
  s:"Kuhar DT, et al. US PHS Guidelines for Occupational HIV Exposure, ICHE 2013；疾病管制署醫療人員血液體液暴觸處理指引"},
 infant:{t:"新生兒發燒",q:"出生 18 天的嬰兒肛溫 38.3°C，活動力看似不錯。處置？",
  o:["住院，完整評估（血液、尿液培養，腰椎穿刺）並給予經驗性抗生素","活動力好就回家觀察","給退燒藥後回家","只驗尿就好"],a:0,
  e:"8–21 天大的發燒嬰兒嚴重細菌感染風險高，即使外觀良好，也建議做血液、尿液、腦脊髓液檢查並住院給抗生素。",
  s:"AAP Clinical Practice Guideline: Evaluation and Management of Well-Appearing Febrile Infants 8 to 60 Days Old（Pantell RH, et al. Pediatrics 2021）"},
 kawasaki:{t:"川崎病",q:"5 歲童發燒 6 天，合併雙眼結膜充血、草莓舌、手腳腫、皮疹。治療首選？",
  o:["IVIG 2 g/kg 合併 aspirin，最好在發燒 10 天內給","只給抗生素","類固醇單獨使用為第一線","退燒觀察即可"],a:0,
  e:"典型川崎病：發燒 ≥5 天加 5 項主要表現中 ≥4 項。發燒 10 天內給 IVIG 可降低冠狀動脈瘤風險，並需追蹤心臟超音波。",
  s:"McCrindle BW, et al. AHA Scientific Statement on Kawasaki Disease, Circulation 2017"},
 ors:{t:"腸胃炎脫水",q:"2 歲童腸胃炎、輕到中度脫水，首選補充方式？",
  o:["口服電解質液（ORS），少量多次","運動飲料","果汁或汽水","一律打點滴"],a:0,
  e:"輕中度脫水首選低滲透壓 ORS；運動飲料與果汁含糖高、電解質不適合，可能加重腹瀉。嚴重脫水或無法口服才需靜脈輸液。",
  s:"WHO／UNICEF 低滲透壓 ORS 建議；AAP 兒童急性腸胃炎處置"},
 mmr:{t:"疫苗與自閉症",q:"家長問：「MMR 疫苗會不會造成自閉症？」最正確的回答依據？",
  o:["大型統合分析顯示疫苗與自閉症無關，原始論文已因造假被撤回","有關聯，所以應該延後接種","目前證據不足，看家長意願","只有男孩有風險"],a:0,
  e:"1998 年 Wakefield 論文已於 2010 年被 Lancet 撤回；2014 年納入逾百萬名兒童的統合分析未發現疫苗與自閉症相關。回答時先傾聽家長擔憂，再提供證據。",
  s:"Taylor LE, et al. Vaccine 2014；The Lancet 撤稿聲明 2010"},
 ectopic:{t:"育齡女性腹痛先驗孕",q:"26 歲女性下腹痛、少量陰道出血。最先應做的檢查？",
  o:["驗孕（尿液或血清 hCG）","先做大腸鏡","直接打止痛藥回家","腹部 X 光"],a:0,
  e:"所有育齡女性腹痛都要先排除懷孕，特別是子宮外孕破裂可能致命。hCG 陽性再搭配陰道超音波。",
  s:"ACOG Practice Bulletin No. 193: Tubal Ectopic Pregnancy（2018）"},
 pph:{t:"產後大出血",q:"產後大出血最常見的原因？",
  o:["子宮收縮不良（Tone）","胎盤殘留","產道裂傷","凝血功能異常"],a:0,
  e:"4T：Tone、Trauma、Tissue、Thrombin，其中子宮收縮不良約占七到八成。第一線為子宮按摩與 oxytocin；tranexamic acid 應於產後 3 小時內給予。",
  s:"WHO Recommendation on Tranexamic Acid for PPH 2017；WOMAN Trial, Lancet 2017"},
 mg:{t:"硫酸鎂中毒",q:"重度子癲前症使用 MgSO4 預防抽搐，最早出現的中毒徵兆是？",
  o:["深部肌腱反射消失","心搏過速","血壓升高","瞳孔放大"],a:0,
  e:"鎂中毒依序為深部肌腱反射消失、呼吸抑制、心跳停止。需監測反射、呼吸與尿量；解毒劑為 calcium gluconate。",
  s:"ACOG Practice Bulletin No. 222: Gestational Hypertension and Preeclampsia（2020）"},
 cpr:{t:"高品質 CPR",q:"成人高品質 CPR 的按壓速率與深度？",
  o:["每分鐘 100–120 下，深度 5–6 公分，每次完全回彈","每分鐘 60 下，深度 3 公分","每分鐘 150 下以上","越深越好，不必回彈"],a:0,
  e:"深度至少 5 公分、避免超過 6 公分。按壓位置在胸骨下半部（2025 版強調左心室位於兩乳連線下方，不再說「對準乳頭連線中點」）。盡量減少中斷，每 2 分鐘換手。",
  s:"Del Rios M, et al. 2025 AHA Guidelines for CPR and ECC. Circulation 2025"},
 ana:{t:"過敏性休克",q:"成人過敏性休克，第一線用藥與途徑？",
  o:["Epinephrine（1 mg/mL）0.01 mg/kg 肌肉注射於大腿前外側，成人單次最多 0.5 mg","Diphenhydramine 靜脈注射","類固醇靜脈注射","Epinephrine 1 mg 靜脈推注"],a:0,
  e:"肌肉注射 epinephrine 是唯一第一線藥物，必要時 5–15 分鐘可重複。抗組織胺與類固醇只是輔助。未接監視器時，1 mg 靜脈推注可能造成致命心律不整。",
  s:"World Allergy Organization Anaphylaxis Guidance 2020"},
 stroke:{t:"中風靜脈溶栓",q:"急性缺血性中風，靜脈溶栓前血壓應控制在多少以下？",
  o:["< 185/110 mmHg","< 120/80 mmHg","< 220/120 mmHg","不用管血壓"],a:0,
  e:"靜脈溶栓時間窗為最後正常時間起 4.5 小時內；給藥前先測血糖，血壓須 <185/110，溶栓後 24 小時維持 <180/105。藥物可用 alteplase 0.9 mg/kg（最大 90 mg）或 tenecteplase 0.25 mg/kg（最大 25 mg）。急性心肌梗塞溶栓的門到針目標是 30 分鐘，中風是 60 分鐘，不要記反。",
  s:"Powers WJ, et al. AHA/ASA Guidelines for Early Management of Acute Ischemic Stroke 2019"},
 snake:{t:"臺灣毒蛇咬傷",q:"在臺灣被龜殼花咬傷，應使用哪一種抗蛇毒血清？",
  o:["抗龜殼花及赤尾鮐蛇毒血清（出血性）","抗雨傘節及飯匙倩蛇毒血清（神經性）","抗百步蛇蛇毒血清","不用血清，切開吸出毒液即可"],a:0,
  e:"臺灣疾管署供應四種抗蛇毒血清。龜殼花、赤尾青竹絲為出血性毒；雨傘節、眼鏡蛇（飯匙倩）為神經性毒。不要切開、吸吮或用止血帶綁死，應固定患肢、儘速送醫。",
  s:"衛生福利部疾病管制署 抗蛇毒血清資訊"},
 op:{t:"有機磷中毒",q:"農藥中毒病人瞳孔縮小、大量流涎、肺部滿是分泌物。主要解毒劑？",
  o:["Atropine，逐步加量直到肺部分泌物乾燥，並合併 pralidoxime","Naloxone","Flumazenil","N-acetylcysteine"],a:0,
  e:"有機磷抑制乙醯膽鹼酯酶造成毒蕈鹼症狀。Atropine 的目標是「肺部乾」，不是瞳孔大小或心跳。",
  s:"Eddleston M, et al. Management of acute organophosphorus pesticide poisoning. Lancet 2008"},
 vf:{t:"心室顫動",q:"病人在急救室出現 VF、無脈搏。最優先？",
  o:["立即電擊，之後馬上接續 CPR 2 分鐘","先給 amiodarone","先插管","先做 12 導程心電圖"],a:0,
  e:"可電擊心律（VF／無脈 VT）首要是盡早電擊，雙相電擊器依廠商建議（常見 120–200 J），不知道就用最大能量。2025 版強調先把電擊做好：初次電擊失敗後再給 epinephrine 1 mg（每 3–5 分鐘）；第三次電擊後仍未恢復給 amiodarone 300 mg，第二劑 150 mg。",
  s:"Del Rios M, et al. 2025 AHA Guidelines for CPR and ECC. Circulation 2025"},
 crc:{t:"國健署大腸癌篩檢",q:"臺灣國民健康署大腸癌篩檢的基本對象與頻率？",
  o:["50–74 歲，每 2 年一次糞便潛血檢查","20 歲以上每年大腸鏡","只有男性","65 歲以上每 5 年一次"],a:0,
  e:"以免疫法糞便潛血檢查（iFOBT）篩檢，陽性者應接受大腸鏡確診。國健署自 2025 年起另有擴大對象（如有家族史者提早），實際資格以最新公告為準。",
  s:"衛生福利部國民健康署 癌症篩檢服務"},
 adult:{t:"成人預防保健",q:"臺灣成人預防保健服務，65 歲以上的補助頻率？",
  o:["每年一次","每 3 年一次","每 5 年一次","終身一次"],a:0,
  e:"40–64 歲每 3 年一次、65 歲以上每年一次（原住民 55 歲以上、小兒麻痺患者 35 歲以上亦每年一次）；2025 年起新增 30–39 歲每 5 年一次。",
  s:"衛生福利部國民健康署 成人預防保健服務"},
 beers:{t:"長者避免的藥",q:"依 Beers Criteria，下列哪個藥物通常應避免用於長者？",
  o:["第一代抗組織胺 diphenhydramine","Acetaminophen","維生素 D","Amlodipine"],a:0,
  e:"第一代抗組織胺抗膽鹼作用強，可能造成譫妄、便秘、尿滯留、跌倒。居家訪視時要檢查多重用藥與成藥。",
  s:"American Geriatrics Society Beers Criteria 2023 Update, J Am Geriatr Soc 2023"},
 hla:{t:"HLA-B*15:02 與 carbamazepine",q:"臺灣開立 carbamazepine 前，健保給付哪項基因檢測以預防 SJS/TEN？",
  o:["HLA-B*15:02","HLA-B*27","BRCA1","CYP2C19"],a:0,
  e:"臺灣研究（Chung WH 等，Nature 2004）發現漢人 HLA-B*15:02 與 carbamazepine 引起 SJS/TEN 強烈相關，帶因者應避免使用。Allopurinol 則與 HLA-B*58:01 相關。",
  s:"Chung WH, et al. Nature 2004；中央健康保險署 HLA-B*1502 基因檢測給付規定"},
 suicide:{t:"詢問自殺意念",q:"關於直接詢問病人是否有自殺想法，何者正確？",
  o:["直接詢問不會增加自殺風險，且有助於評估與轉介","問了會讓病人想到自殺，應避免","只有精神科醫師才能問","病人沒主動提就不必問"],a:0,
  e:"研究顯示詢問自殺意念不會提高自殺風險。臺灣可轉介 1925 安心專線（24 小時免付費）。",
  s:"Dazzi T, et al. Psychol Med 2014；衛生福利部 1925 安心專線"},
 npo:{t:"術前禁食",q:"健康成人擇期手術，清流質飲料最晚可在麻醉前多久喝？",
  o:["2 小時","6 小時","8 小時","前一晚 12 點後全禁"],a:0,
  e:"清流質 2 小時、母乳 4 小時、配方奶與輕食 6 小時、油炸或含脂肪餐點 8 小時。過度禁食反而增加不適與脫水。",
  s:"ASA Practice Guidelines for Preoperative Fasting, Anesthesiology 2017（2023 更新）"},
 contrast:{t:"Metformin 與顯影劑",q:"病人服用 metformin，eGFR 25 mL/min/1.73m²，要打碘顯影劑。建議？",
  o:["檢查時停用 metformin，48 小時後確認腎功能穩定再恢復","不需任何處理","永久停用","改打兩倍顯影劑"],a:0,
  e:"eGFR <30 或急性腎損傷者，於注射顯影劑時暫停 metformin，48 小時後評估腎功能再恢復；腎功能正常者通常不必停。",
  s:"ACR Manual on Contrast Media（American College of Radiology）"},
 eye:{t:"化學性眼灼傷",q:"工人被鹼性清潔劑噴到眼睛，第一步？",
  o:["立即大量清水或生理食鹽水沖洗，直到 pH 回到中性","先測視力再沖洗","先點抗生素眼藥","先轉眼科門診排隊"],a:0,
  e:"化學傷是眼科少數「先治療、後檢查」的急症，鹼性比酸性更易造成深層傷害。沖洗至少 30 分鐘並以試紙確認 pH。",
  s:"American Academy of Ophthalmology：Chemical Eye Injury"},
 minicex:{t:"Mini-CEX",q:"評核時，主治醫師在旁觀察你實際問診、身體檢查與溝通，並當場回饋。這是哪種工具？",
  o:["Mini-CEX","DOPS","CbD","OSCE"],a:0,
  e:"Mini-CEX：觀察臨床面對病人的表現；DOPS：直接觀察操作技術；CbD：以病歷為本的討論；OSCE：客觀結構式臨床測驗站。臺灣 PGY 訓練常用這些工作場所評量。",
  s:"Norcini JJ, et al. Ann Intern Med 2003；衛福部二年期一般醫學訓練計畫評核規定"},
 af:{t:"心房顫動抗凝",q:"非瓣膜性心房顫動、CHA₂DS₂-VASc 高分，一般首選口服抗凝劑？",
  o:["DOAC（直接口服抗凝劑），優先於 warfarin","Aspirin 單獨使用即可","Warfarin 永遠首選","不需抗凝"],a:0,
  e:"適合者首選 DOAC；機械瓣膜或中重度二尖瓣狹窄者仍用 warfarin。Aspirin 單獨使用不建議作為中風預防。",
  s:"2023 ACC/AHA/ACCP/HRS Guideline for Atrial Fibrillation, Circulation 2024"},
 stemi:{t:"STEMI 門到球時間",q:"STEMI 病人送達可做導管的醫院，門到球（door-to-balloon）目標？",
  o:["≤ 90 分鐘","≤ 6 小時","≤ 24 小時","不限時間"],a:0,
  e:"同時給予 aspirin 162–325 mg 嚼服；做 PCI 者 P2Y12 首選 ticagrelor 或 prasugrel。SpO₂ ≥90% 不需常規給氧，舊口訣 MONA 已不適用。到院 10 分鐘內完成 12 導程心電圖是一切的起點。",
  s:"Rao SV, et al. 2025 ACC/AHA/ACEP/NAEMSP/SCAI Guideline for the Management of Patients With Acute Coronary Syndromes. Circulation 2025"},
 inr:{t:"Warfarin 過量",q:"病人 INR 12，沒有出血。建議處置？",
  o:["暫停 warfarin，並給予口服維生素 K","繼續原劑量","立即輸新鮮冷凍血漿","給靜脈 protamine"],a:0,
  e:"INR >10 無出血：停藥並給口服維生素 K；INR 4.5–10 無出血：停藥觀察，不常規給維生素 K；有嚴重出血：靜脈維生素 K 加凝血酶原複合物（PCC）。Protamine 是 heparin 的解藥。",
  s:"Holbrook A, et al. ACCP Antithrombotic Therapy Guidelines 9th ed., Chest 2012"},
 apap:{t:"Acetaminophen 過量",q:"Acetaminophen 一次大量服用，用 Rumack-Matthew 圖判讀血中濃度，最早何時抽血有意義？",
  o:["服藥後 4 小時","服藥後 30 分鐘","服藥後 48 小時","任何時間都一樣"],a:0,
  e:"4 小時前藥物仍在吸收，濃度無法判讀。解毒劑為 N-acetylcysteine，8 小時內給效果最好。",
  s:"Rumack BH, Matthew H. Pediatrics 1975；Chiew AL, et al. Med J Aust 2020（澳紐指引）"},
 trauma:{t:"創傷初級評估",q:"創傷初級評估（primary survey）的第一步？",
  o:["呼吸道（Airway）並同時保護頸椎","先處理骨折","先問病史","先送 CT"],a:0,
  e:"順序為 ABCDE：Airway（含頸椎保護）、Breathing、Circulation（止血）、Disability、Exposure。",
  s:"ACS ATLS 第 10 版，2018"},
 mtp:{t:"大量輸血比例",q:"創傷大量輸血，常見的血漿：血小板：紅血球比例？",
  o:["約 1:1:1","1:1:4","只輸紅血球","1:0:1"],a:0,
  e:"PROPPR 試驗顯示 1:1:1 比 1:1:2 更快達到止血、出血死亡較少；並在受傷 3 小時內給 tranexamic acid（1 g 靜注 10 分鐘，再 1 g 於 8 小時，CRASH-2）。可用 ABC score ≥2（軀幹穿刺傷、SBP ≤90、HR ≥120、FAST 陽性）預測需要啟動。血品中的檸檬酸會螯合鈣，要追 iCa 並補鈣。注意台灣 1U 只有美國單位的一半，比例不變、數字加倍。",
  s:"Holcomb JB, et al. PROPPR Trial, JAMA 2015；ACS TQIP Massive Transfusion in Trauma Guidelines 2014"},
 compart:{t:"腔室症候群",q:"脛骨骨折後，腔室症候群最早期、最可靠的徵兆？",
  o:["與傷勢不成比例的疼痛，被動伸展時更痛","摸不到脈搏","皮膚蒼白","完全癱瘓"],a:0,
  e:"無脈搏、癱瘓是晚期表現，等到出現已太遲。懷疑時應鬆開石膏敷料並緊急會診做筋膜切開。",
  s:"ACS ATLS 第 10 版，2018"},
 ecg10:{t:"胸痛十分鐘",q:"胸痛病人到急診，12 導程心電圖應在多久內完成判讀？",
  o:["10 分鐘內","1 小時內","掛號後排隊","等抽血結果"],a:0,
  e:"10 分鐘內完成並判讀心電圖，是辨識 STEMI 的關鍵。首次正常但症狀持續，應重複做。",
  s:"2021 AHA/ACC Chest Pain Guideline, Circulation 2021"},
 nalox:{t:"鴉片類過量",q:"呼吸每分鐘 6 次、瞳孔針尖狀、意識不清，疑似鴉片類過量。解毒劑？",
  o:["Naloxone","Flumazenil","Atropine","Physostigmine"],a:0,
  e:"Naloxone 可靜脈、肌肉或鼻噴。作用時間可能比鴉片類短，需持續觀察是否再度抑制呼吸。",
  s:"AHA 2020 Opioid-Associated Emergency 建議"},
 gcs:{t:"GCS",q:"GCS 昏迷指數的總分範圍？",
  o:["3–15","0–15","1–10","0–12"],a:0,
  e:"睜眼 E1–4、語言 V1–5、運動 M1–6。GCS ≤8 通常需考慮建立確定性呼吸道。",
  s:"Teasdale G, Jennett B. Lancet 1974"},
 heat:{t:"熱中暑",q:"戶外勞動者體溫 41°C、意識混亂。最重要的處置？",
  o:["立即積極降溫，冰水浸泡是最有效的方法","先給 acetaminophen 退燒","慢慢降溫比較安全","先抽血再說"],a:0,
  e:"熱中暑：核心體溫 >40°C 合併中樞神經異常。退燒藥無效；應「先降溫、後送醫」，目標 30 分鐘內降到約 39°C 以下。",
  s:"Wilderness Medical Society Clinical Practice Guidelines for Heat Illness 2019"},
 cam:{t:"CAM 譫妄評估",q:"CAM（Confusion Assessment Method）診斷譫妄的必要條件是？",
  o:["急性發作且波動，加上注意力不集中，再加上思考紊亂或意識程度改變其中之一","只要有失智症就算","只要晚上睡不著就算","病人自己說混亂才算"],a:0,
  e:"譫妄是急症，要找原因：感染、藥物、電解質、尿滯留、便秘、疼痛、缺氧等。",
  s:"Inouye SK, et al. Ann Intern Med 1990"},
 delir:{t:"譫妄的第一線處置",q:"住院長者夜間譫妄、拔管路。最優先？",
  o:["找出並處理誘因，加上非藥物介入（定向、睡眠、家屬陪伴）","立即給 benzodiazepine","直接約束到天亮","把燈全關讓他睡"],a:0,
  e:"Benzodiazepine 可能加重譫妄（酒精戒斷除外）。抗精神病藥只在危及安全時短期低劑量使用。約束本身也會加重譫妄。",
  s:"AGS Beers Criteria 2023；NICE Guideline CG103 Delirium"},
 tug:{t:"跌倒風險",q:"計時起走測試（TUG）超過幾秒，表示跌倒風險增加？",
  o:["12 秒以上","3 秒以上","60 秒以上","不能用來評估跌倒"],a:0,
  e:"美國 CDC STEADI 以 ≥12 秒作為跌倒風險增加的參考。另需檢視用藥、視力、居家環境。",
  s:"CDC STEADI：Timed Up & Go Assessment"},
 dyspnea:{t:"末期呼吸困難",q:"末期癌症病人呼吸喘，已排除可逆原因。症狀緩解的藥物首選？",
  o:["低劑量鴉片類（如 morphine）","大劑量 benzodiazepine","立即插管","不給藥，避免成癮"],a:0,
  e:"低劑量鴉片類可有效緩解末期呼吸困難，依症狀調整時不會加速死亡。搭配電扇吹臉、調整姿勢等非藥物方法。",
  s:"ASCO Guideline: Management of Dyspnea in Advanced Cancer 2021"},
 dnr:{t:"安寧緩和醫療條例",q:"末期病人已意識昏迷，事前未簽署意願書。依《安寧緩和醫療條例》，不施行心肺復甦術可由誰出具同意書？",
  o:["最近親屬","主治醫師單獨決定","護理長","任何一位朋友"],a:0,
  e:"病人無法表達意願時，由最近親屬出具同意書（配偶、成年子女孫子女、父母…依序）；並須經兩位醫師診斷為末期病人，其中一位具相關專科資格。",
  s:"安寧緩和醫療條例 第 7 條（全國法規資料庫）"},
 acp:{t:"病人自主權利法",q:"依《病人自主權利法》，簽署「預立醫療決定」前必須先完成什麼？",
  o:["預立醫療照護諮商（ACP），並經公證或兩位見證人見證、註記於健保卡","只要家屬同意","主治醫師簽名即可","不需要任何程序"],a:0,
  e:"病主法於 2019 年 1 月 6 日施行，具完全行為能力者可預立醫療決定，在五種臨床條件下選擇接受或拒絕維持生命治療或人工營養及流體餵養。",
  s:"病人自主權利法 第 8、9 條（全國法規資料庫）"},
 hypercal:{t:"惡性腫瘤高血鈣",q:"癌症病人血鈣 14.2 mg/dL、脫水、意識變差。第一步？",
  o:["靜脈生理食鹽水補充水分","立刻給 thiazide 利尿劑","補充鈣片","限制喝水"],a:0,
  e:"先補足水分，再給 bisphosphonate（數天後起效）或 denosumab；calcitonin 起效快但短暫。Thiazide 反而會升高血鈣。",
  s:"Endocrine Society Clinical Practice Guideline: Treatment of Hypercalcemia of Malignancy, JCEM 2023"},
 isbar:{t:"ISBAR 交班",q:"ISBAR 交班中的「S」代表？",
  o:["Situation：病人現在發生什麼事","Signature：簽名","Symptom：所有症狀列表","Schedule：排程"],a:0,
  e:"I（Identify 自我與病人辨識）、S（Situation 現況）、B（Background 背景）、A（Assessment 評估）、R（Recommendation 建議）。結構化交班可減少遺漏。",
  s:"WHO Patient Safety Solutions：Communication During Patient Hand-overs（2007）；醫策會病人安全年度目標"},
 htn:{t:"住院無症狀高血壓",q:"凌晨 3 點：8 床 BP 182/98，病人無胸痛、頭痛、神經學症狀。最適當的處置？",
  o:["親自評估、找原因（疼痛、尿滯留、漏服藥），通常不需緊急靜脈降壓","立刻靜脈推注降壓藥","舌下 nifedipine","不用理會"],a:0,
  e:"無器官損傷的住院高血壓多不需急降，靜脈降壓反而可能造成低血壓與缺血。舌下 nifedipine 會突然大幅降壓，已不建議使用。",
  s:"Anderson TS, et al. JAMA Intern Med 2019；2017 ACC/AHA Hypertension Guideline"},
lemon:{t:"LEMON 困難呼吸道評估",q:"LEMON 評估中的「3-3-2 法則」在看什麼？",
  o:["張口約 3 指寬、頦尖到舌骨 3 指、舌骨到甲狀軟骨上緣 2 指，評估喉頭鏡視野是否容易對齊","頸圍 3 吋、體重 3 倍、年齡 2 倍","GCS 的睜眼、語言、運動分數","最多插 3 次、換人 3 次、放棄 2 次"],a:0,
  e:"LEMON：Look（外觀，如顏面外傷、鬍鬚、短頸）、Evaluate 3-3-2、Mallampati 分級、Obstruction（呼吸道阻塞）、Neck mobility（頸部活動度）。預期困難時，先準備備案與求援。",
  s:"Reed MJ, et al. Can an airway assessment score predict difficulty at intubation in the emergency department? Emerg Med J 2005"},
 preox:{t:"插管前預給氧",q:"自主呼吸的病人準備快速序列插管（RSI），預給氧的標準做法？",
  o:["面罩緊密貼合，100% 氧氣正常呼吸至少 3 分鐘（或 8 次深呼吸），頭抬高擺位","吸室內空氣就夠了","先用甦醒球大力擠壓高潮氣量","插管失敗之後再給氧"],a:0,
  e:"預給氧把肺內氮氣換成氧氣，延長無呼吸時的安全時間。頭抬高（肥胖者採 ramped 擺位，使外耳道與胸骨切跡同高），可加上鼻導管做無呼吸期給氧。",
  s:"Frerk C, et al. Difficult Airway Society 2015 guidelines for management of unanticipated difficult intubation in adults. Br J Anaesth 2015"},
 etco2:{t:"確認氣管內管位置",q:"插管後，確認氣管內管在氣管內最可靠的方法？",
  o:["持續波形呼氣末二氧化碳（waveform capnography）","聽診上腹部有沒有聲音","看管壁有沒有起霧","胸部 X 光"],a:0,
  e:"「No trace = wrong place」：沒有持續 CO₂ 波形就要懷疑在食道。聽診與起霧都不可靠；胸部 X 光用來確認深度（管尖約在隆凸上 3–5 公分），不能分辨氣管或食道。",
  s:"Frerk C, et al. Difficult Airway Society 2015 guidelines, Br J Anaesth 2015；Del Rios M, et al. 2025 AHA Guidelines for CPR and ECC. Circulation 2025"},
 succ:{t:"Succinylcholine 的禁忌",q:"RSI 時，下列哪位病人應避免使用 succinylcholine？",
  o:["洗腎病人，血鉀 6.8 mEq/L","健康年輕人，急性闌尾炎","氣喘急性發作","上消化道出血"],a:0,
  e:"Succinylcholine 會讓血鉀上升約 0.5 mEq/L；高血鉀、惡性高熱病史，以及受傷一段時間後的大面積燒燙傷、擠壓傷、長期臥床或神經肌肉疾病都應避免。替代藥物為 rocuronium 1.0–1.2 mg/kg，可用 sugammadex 逆轉。",
  s:"Tran DTT, et al. Rocuronium versus succinylcholine for rapid sequence induction intubation. Cochrane Database Syst Rev 2015"},
 failed:{t:"插管失敗怎麼辦",q:"插管兩次失敗，SpO₂ 開始往下掉。依 DAS 指引下一步？",
  o:["停止反覆嘗試，放聲門上呼吸道（如喉罩）先維持氧合；無法插管也無法氧合（CICO）時，立即行環甲膜切開","繼續插到成功為止","先拔掉氧氣讓視野清楚","等主治醫師來，期間先不要通氣"],a:0,
  e:"DAS 流程：Plan A 喉頭鏡插管（最多 3 次，較資深者可第 4 次）→ Plan B 聲門上呼吸道 → Plan C 面罩通氣 → Plan D 前頸部緊急呼吸道（建議手術刀環甲膜切開）。重點是氧合，不是插管成功。",
  s:"Frerk C, et al. Difficult Airway Society 2015 guidelines, Br J Anaesth 2015"},
 ratio:{t:"按壓與通氣比",q:"成人 CPR，尚未放進階呼吸道時按壓通氣比？放好氣管內管之後呢？",
  o:["30:2；插管後持續按壓不中斷，每 6 秒給 1 次通氣（每分鐘 10 次）","15:2；插管後每 2 秒通氣 1 次","30:2；插管後仍要停下來做 30:2","5:1"],a:0,
  e:"放置進階呼吸道後不再停下來通氣；過度通氣會升高胸內壓、減少回心血量。",
  s:"Del Rios M, et al. 2025 AHA Guidelines for CPR and ECC. Circulation 2025"},
 etco2cpr:{t:"CPR 中的 EtCO₂",q:"CPR 進行中，EtCO₂ 一直 < 10 mmHg，代表什麼？",
  o:["按壓品質可能不足，應檢討深度、速率與中斷；若 EtCO₂ 突然明顯上升要想到 ROSC","病人已恢復自發循環","應該立即停止急救","代表氣管內管一定在食道，要立刻拔掉"],a:0,
  e:"已插管病人的 EtCO₂ 可以監測按壓品質（理想 >20 mmHg）與早期辨識 ROSC。2025 版看「突然上升」（升幅超過約 10 mmHg），不再背 35–40 的絕對值。數值低時先改善 CPR，也要排除管路位置問題。",
  s:"Del Rios M, et al. 2025 AHA Guidelines for CPR and ECC. Circulation 2025"},
 pea:{t:"Asystole 的處置",q:"監視器顯示 asystole（已確認導程與增益）。處置？",
  o:["持續 CPR，盡快給 epinephrine 1 mg，每 3–5 分鐘重複，並找可逆原因","立即電擊 200 焦耳","給 amiodarone 300 mg","給 atropine 1 mg"],a:0,
  e:"Asystole 與 PEA 屬不可電擊心律，電擊無益。Atropine 已不再建議用於 asystole／PEA。",
  s:"Del Rios M, et al. 2025 AHA Guidelines for CPR and ECC. Circulation 2025"},
 hts:{t:"H's & T's",q:"下列何者「不屬於」心跳停止的可逆原因 H's & T's？",
  o:["高血糖（Hyperglycemia）","低血氧（Hypoxia）","心包膜填塞（Tamponade）","張力性氣胸（Tension pneumothorax）"],a:0,
  e:"H：Hypovolemia、Hypoxia、Hydrogen ion（酸中毒）、Hypo/Hyperkalemia、Hypothermia。T：Tension pneumothorax、Tamponade、Toxins、Thrombosis（肺栓塞、冠狀動脈）。",
  s:"Del Rios M, et al. 2025 AHA Guidelines for CPR and ECC. Circulation 2025"},
 rosc:{t:"ROSC 後照護",q:"ROSC 後病人仍昏迷，體溫處置建議？",
  o:["主動體溫控制在 32–37.5°C，總時長至少 36 小時，並避免發燒","不需要特別處理","主動加溫到 39°C","只有院外心跳停止才需要"],a:0,
  e:"2025 版數值：體溫控制 32–37.5°C 至少 36 小時（舊版 32–36°C、24 小時）；SpO₂ 90–98%、PaCO₂ 35–45 mmHg、MAP ≥65 mmHg、血糖避免 <70 或 >180 mg/dL。做 12 導程心電圖，STEMI 緊急心導管；預後判斷要多模態、延到 ROSC 後至少 72 小時。",
  s:"Del Rios M, et al. 2025 AHA Guidelines for CPR and ECC. Circulation 2025"},
 brady:{t:"有症狀的心搏過緩",q:"心跳 34、血壓 78/40、病人頭暈。第一線藥物？",

/* ======================= 狀態 ======================= */
const KEY = "pgy-rpg-v2";
let S = null;
function fresh(name){
  return {name, hosp:null, hp:100, maxhp:100, mood:70, know:0, hours:230, month:0,
    stage:-1, step:0, rel:{}, met:{}, cards:{}, right:0, total:0, burnout:0, electDone:[], electQueue:null,
    log:[], hourLog:[], note:""};
}
/* 每個人用自己的 Claude 帳號存檔；沒有登入時退回這台裝置的瀏覽器存檔 */
const CLOUD = {ref:null, data:null, ready:false, busy:false, again:false, timer:0};
function save(){
  if(S) S.savedAt = Date.now();
  if(CLOUD.ref){ clearTimeout(CLOUD.timer); CLOUD.timer = setTimeout(cloudWrite, 1200); return; }
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){}
}
async function cloudWrite(){
  if(CLOUD.busy){ CLOUD.again = true; return; }
  CLOUD.busy = true;
  try{ const s = JSON.stringify(S); CLOUD.data = S ? JSON.parse(s) : null; await CLOUD.ref.set({s, at:Date.now()}); }
  catch(e){ setCloudNote("雲端存檔暫時失敗，下一步會再試一次。"); }
  CLOUD.busy = false;
  if(CLOUD.again){ CLOUD.again = false; cloudWrite(); }
}
function load(){
  if(CLOUD.ref) return CLOUD.data;
  try{ const v = localStorage.getItem(KEY); return v ? JSON.parse(v) : null; }catch(e){ return null; }
}
function clearSave(){
  if(CLOUD.ref){ clearTimeout(CLOUD.timer); CLOUD.data = null; CLOUD.ref.delete().catch(()=>{}); }
  try{ localStorage.removeItem(KEY); }catch(e){}
}
function setCloudNote(t){ const n = document.getElementById("acct"); if(n) n.textContent = t; }
function cloudNote(){
  if(CLOUD.ref) return "☁ 已登入：進度存在你自己的帳號，換電腦或手機也能接著玩；別人看不到你的存檔。";
  if(!window.claude) return "進度存在這台裝置的瀏覽器，換裝置不會跟著走。";
  if(CLOUD.ready) return "目前沒有登入，進度只存在這台裝置的瀏覽器。";
  return "正在確認帳號…";
}
(async () => {
  try{
    const db = await window.claude?.use?.("db"); const user = await window.claude?.use?.("user");
    const id = db && user ? await user.id() : null;
    if(id){
      const ref = db.collection("data/users/"+id).doc("pgy");
      const snap = await ref.get();
      let data = null;
      if(snap.exists){ try{ data = JSON.parse(snap.data().s); }catch(e){} }
      else { const local = (() => { try{ const v = localStorage.getItem(KEY); return v ? JSON.parse(v) : null; }catch(e){ return null; } })();
        if(local){ data = local; try{ await ref.set({s:JSON.stringify(local), at:Date.now()}); }catch(e){} } }
      CLOUD.ref = ref; CLOUD.data = data;
    }
  }catch(e){}
  CLOUD.ready = true;
  if(!S) titleScreen(); else setCloudNote(cloudNote());
})();
function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const rich = s => esc(s).replace(/\[\[(\w+)\]\]/g, (m,k) => REF_NO[k] ? `<a class="ref" href="#ref-${REF_NO[k]}" data-ref="${REF_NO[k]}">[${REF_NO[k]}]</a>` : "");
const plain = s => String(s).replace(/\[\[(\w+)\]\]/g, "");

function monthLabel(){ const y = S.month < 12 ? 1 : 2; const m = S.month < 12 ? S.month+1 : S.month-11; return `Y${y}·${String(Math.min(m,12)).padStart(2,"0")}月`; }
function addLog(txt){ if(!S) return; S.log.unshift({w:monthLabel(), t:txt, s:0}); if(S.log.length>200) S.log.length=200; }

function applyFx(fx={}, rel={}){
  const out = [];
  if(fx.maxhp){ S.maxhp += fx.maxhp; S.hp = clamp(S.hp+fx.maxhp,0,S.maxhp); out.push(`體力上限 ${fx.maxhp>0?"+":""}${fx.maxhp}`); }
  if(fx.hp){ S.hp = clamp(S.hp+fx.hp,0,S.maxhp); out.push(`健康 ${fx.hp>0?"+":""}${fx.hp}`); }
  if(fx.mood){ S.mood = clamp(S.mood+fx.mood,0,100); out.push(`幸福 ${fx.mood>0?"+":""}${fx.mood}`); }
  if(fx.know){ S.know += fx.know; out.push(`知識 +${fx.know}`); }
  if(fx.hours){ S.hours += fx.hours*8; out.push(`工時 +${fx.hours*8} 小時`); }
  for(const [k,v] of Object.entries(rel||{})){ S.rel[k]=(S.rel[k]||0)+v; S.met[k]=1; out.push(`${CH[k].n} ${v>0?"+":""}${v}`); }
  return out.join("　");
}

/* ======================= 側欄：狀態／人生地圖／工時曲線／訓練紀錄 ======================= */
const DEPT_COL = [["內科","#2c6e5c"],["外科","#30506e"],["兒科","#c07a12"],["婦產","#8a3b5c"],["急診","#a3342e"],["社區","#1f7a6a"],["老年","#5b5ea6"],["選修","#7a5bb3"]];
const colOf = d => (DEPT_COL.find(([k]) => d.includes(k)) || ["","#888"])[1];
function socialScore(){ const ks = Object.keys(S.met).filter(k => CH[k] && MET_ORDER.includes(k)); if(!ks.length) return 50; const avg = ks.reduce((a,k)=>a+(S.rel[k]||0),0)/ks.length; return clamp(Math.round(50+avg*10),0,100); }
function renderSide(){
  const side = document.getElementById("side");
  if(!S || S.stage<0){ side.innerHTML = introSide(); return; }
  const st = STAGES[Math.min(S.stage, STAGES.length-1)];
  const bar = (lab,v,max,alert,txt) => `<div class="stat ${alert?"alert":""}"><span>${lab}</span><i><b style="width:${clamp(v/max*100,0,100)}%"></b></i><em>${txt ?? Math.round(v)}</em></div>`;
  const know100 = clamp(Math.round(S.know/2.5),0,100);
  // map
  let cells = [], m = 0;
  STAGES.forEach(s => { for(let k=0;k<s.m;k++){ cells.push({c:colOf(s.dept), d:s.dept, i:m}); m++; } });
  const mapHtml = cells.map(c => `<div title="${esc(c.d)}" class="${c.i===S.month?"now":""}" style="${c.i<S.month?`background:${c.c}`:""}"></div>`).join("");
  const legend = DEPT_COL.map(([k,c]) => `<span style="--c:${c}">${k}</span>`).join("");
  side.innerHTML = `
  <section class="panel" aria-label="狀態">
    <div class="panel-h"><h3>DR. ${esc(S.name)}</h3><span class="where">${S.month<12?"PGY1":"PGY2"} · ${esc(st.dept)}</span></div>
    ${bar("健康",S.hp,S.maxhp,S.hp<30)}${bar("幸福",S.mood,100,S.mood<25)}${bar("知識",know100,100,false)}${bar("人際關係",socialScore(),100,false)}
    ${bar("四週工時",S.hours,320,S.hours>280,S.hours+"h")}
  </section>
  <section class="panel" aria-label="人生地圖">
    <div class="panel-h"><h3>人生地圖</h3><span class="hint">1 格 = 1 個月 · ${S.month}/24</span></div>
    <div class="map">${mapHtml}</div><div class="legend">${legend}</div>
  </section>
  <section class="panel curve" aria-label="工時曲線">
    <div class="panel-h"><h3>工時曲線</h3><span class="hint">各科結束時的四週工時</span></div>${curve()}
  </section>
  <section class="panel" aria-label="訓練紀錄">
    <div class="panel-h"><h3>訓練紀錄</h3><span class="hint">新的在上 · 點一下加☆</span></div>
    ${S.log.length ? `<ul class="log">${S.log.map((l,i)=>`<li><button data-log="${i}"><span class="when">${esc(l.w)}</span><span>${esc(l.t)}</span><span class="star">${l.s?"☆":""}</span></button></li>`).join("")}</ul>` : `<p class="hint">做出第一個選擇後，這裡會留下紀錄。</p>`}
  </section>`;
  side.querySelectorAll("[data-log]").forEach(b => b.onclick = () => { const l = S.log[+b.dataset.log]; l.s = l.s?0:1; save(); renderSide(); });
}
function introSide(){
  return `<section class="panel"><div class="panel-h"><h3>這是什麼遊戲</h3></div>
   <p class="meta" style="margin:0">一款以真實制度為骨架的文字 RPG。兩年 24 格人生地圖，每一格是一個月的輪訓。題目答完會收進知識卡，並附參考文獻與讀書網站的延伸閱讀。</p></section>
   <section class="panel"><div class="panel-h"><h3>延伸讀書</h3></div>
   <div class="study">${Object.values(SITES).filter(s=>s.u&&!s.hide).map(s=>`<a href="${s.u}" target="_blank" rel="noopener">${esc(s.n)} ↗</a>`).join("")}</div></section>`;
}
function curve(){
  const pts = S.hourLog;
  if(!pts.length) return `<p class="hint" style="margin:0">完成第一個科別後出現。上限 320 小時／四週[[cgmh]]。</p>`.replace("[[cgmh]]", `<a class="ref" href="#ref-${REF_NO.cgmh}" data-ref="${REF_NO.cgmh}">[${REF_NO.cgmh}]</a>`);
  const W=300,H=120,L=30,R=8,T=10,B=22, max=360;
  const x = i => L + (pts.length===1 ? (W-L-R)/2 : i*(W-L-R)/(pts.length-1));
  const y = v => T + (1-v/max)*(H-T-B);
  const line = pts.map((p,i)=>`${x(i).toFixed(1)},${y(p.h).toFixed(1)}`).join(" ");
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="各科四週工時">
   ${[0,160,320].map(v=>`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1" ${v===320?'stroke-dasharray="4 3" stroke="var(--stamp)"':""}/><text x="${L-4}" y="${y(v)+3}" text-anchor="end">${v}</text>`).join("")}
   <text x="${W-R}" y="${y(320)-4}" text-anchor="end" style="fill:var(--stamp)">上限 320h</text>
   <polyline points="${line}" fill="none" stroke="var(--drape)" stroke-width="2"/>
   ${pts.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p.h)}" r="${i===pts.length-1?4:2.5}" fill="${p.h>320?"var(--stamp)":"var(--drape)"}"/>`).join("")}
   <text x="${x(0)}" y="${H-6}" text-anchor="${pts.length===1?"middle":"start"}">${esc(pts[0].lab)}</text>
   ${pts.length>1?`<text x="${x(pts.length-1)}" y="${H-6}" text-anchor="end">${esc(pts[pts.length-1].lab)}</text>`:""}
  </svg>`;
}

/* ======================= 主流程 ======================= */
function run(){
  worldSync();
  if(S.stage<0) return chooseHospital();
  const st = STAGES[S.stage];
  if(!st) return ending();
  if(st.elective && S.step >= st.steps.length){
    if(!S.electQueue) return pickElective(st);
    if(S.electQueue.length){
      const e = ELECTIVES[S.electQueue[0]];
      const idx = S.step - st.steps.length;
      if(idx < e.steps.length) return step(e.steps[idx], st);
      S.electQueue.shift(); S.step = st.steps.length; save();
      if(S.electQueue.length) return run();
      if(S.electCount < st.elective) return pickElective(st);
    }
    return endStage();
  }
  if(S.step >= st.steps.length) return endStage();
  step(st.steps[S.step], st);
}
function next(){ S.step++; save(); checkLimits() || run(); }

function checkLimits(){

     <div class="feedback"><strong>真實制度</strong><span>住院醫師自 2019 年 9 月 1 日起適用勞動基準法；《住院醫師勞動權益保障及工作時間指引》以四週為單位，總工時上限 320 小時${rich("[[cgmh]][[pts]]")}。</span></div>
     <p class="fx">${applyFx({hp:15,mood:-3},{lin:2})}</p>${nxBtn("去休息")}`);

     <p>教學部安排你休息兩天。疲勞不是意志力問題，是病人安全問題。</p>

function choiceScreen(head, s, done){
  show(`${head}${speaker(s.who,s.text)}<div class="opts">${s.opts.map((o,i)=>`<button class="opt" data-i="${i}">${esc(o.l)}</button>`).join("")}</div>`);
  V().querySelectorAll(".opt").forEach(b => b.onclick = () => {

    show(`${speaker("sys", o.r)}<p class="fx">${fx}</p>${nxBtn()}`);
    document.getElementById("nx").onclick = done;
  });

function step(s, st){
  worldSync();
  gate(s.t==="night" ? "kui" : s.who, (S.step===0) ? stageBanner(st) : "", () => step0(s, st));
}
function step0(s, st){
  const head = (S.step===0) ? stageBanner(st) : "";
  if(s.who) S.met[s.who] = 1;
  if(s.t==="say"){
    show(`${head}${speaker(s.who,s.text)}${nxBtn()}`);
    document.getElementById("nx").onclick = next;
  } else if(s.t==="choice"){
    choiceScreen(head, s, next);
  } else if(s.t==="quiz"){
    askQuiz(head, s.who, s.lead, s.id, () => next());
  } else if(s.t==="boss"){
    runBoss(head, s);
  } else if(s.t==="night"){
    const ev = NIGHT[s.n % NIGHT.length];
    S.met.kui = 1; applyFx({hours:2}); addLog("夜班");
    runSeq(head + `<span class="stamp">夜班</span>`, ev, next);
  } else if(s.t==="yearEnd"){
    yearEnd();
  } else if(s.t==="ending"){
    ending();
  }
}

function runSeq(head, list, done, i=0){
  if(i>=list.length) return done();
  const s = list[i];
  const go = () => runSeq("", list, done, i+1);
  if(s.t==="say"){ show(`${head}${speaker(s.who,s.text)}${nxBtn()}`); document.getElementById("nx").onclick = go; }
  else if(s.t==="quiz"){ askQuiz(head, s.who, s.lead, s.id, go); }
  else if(s.t==="choice"){ choiceScreen(head, s, go); }
}

function shuffled(n){ const a=[...Array(n).keys()]; for(let i=n-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function studyLinks(id){
  const list = (STUDY[id]||[]).filter(([k]) => SITES[k].u);
  if(SITES.gas.u) list.push(["gas","PGY 職前準備"]);
  if(!list.length) return "";
  return `<div class="study"><span>延伸閱讀：</span>${list.map(([k,ch]) => `<a href="${SITES[k].u}" target="_blank" rel="noopener">${esc(SITES[k].n)}｜${esc(ch)} ↗</a>`).join("")}</div>`;
}

function askOrder(head, who, lead, id, done){
  const q = QB[id]; const order = shuffled(q.ord.length); const picked = [];
  S.met[who] = 1;
  show(`${head}<span class="stamp">技能</span>${speaker(who, (lead ? lead+"\n" : "") + q.q)}<p class="hint">依序點選，已選的會標上號碼。</p><div class="opts">${order.map(k=>`<button class="opt" data-k="${k}">${esc(q.ord[k])}</button>`).join("")}</div>`);
  V().querySelectorAll(".opt").forEach(b => b.onclick = () => {
    picked.push(+b.dataset.k); b.disabled = true; b.textContent = `${picked.length}. ${q.ord[+b.dataset.k]}`;
    if(picked.length < q.ord.length) return;
    const ok = picked.every((k,i) => k===i);
    V().querySelectorAll(".opt").forEach(x => { const k=+x.dataset.k; x.classList.add(picked.indexOf(k)===k ? "right" : "wrong"); });
    S.total++; if(ok) S.right++; worldReact(ok); S.cards[id] = 1;
    addLog(`${ok?"✓":"✗"} ${q.t}`);
    const fx = applyFx(ok ? {know:6, mood:3, hours:0.5} : {know:2, hp:-8, mood:-3, hours:0.5});
    const fb = document.createElement("div");
    fb.className = "feedback" + (ok ? "" : " bad");
    fb.innerHTML = `<span class="stamp ${ok?"ok":""}">${ok?"順序正確":"順序有誤"}</span><strong>正確順序</strong><ol style="margin:0;padding-left:1.4em">${q.ord.map(t=>`<li>${esc(t)}</li>`).join("")}</ol><span>${esc(q.e)}<a class="ref" href="#ref-${q.ref}" data-ref="${q.ref}">[${q.ref}]</a></span><span class="src">參考文獻 [${q.ref}]：${esc(q.s)}</span><span class="fx">${fx}　｜已收入知識卡</span>`;
    const btn = document.createElement("button"); btn.className="primary"; btn.textContent="繼續"; btn.dataset.auto = "1";
    btn.onclick = () => done(ok);
    V().append(fb, btn); renderSide(); save(); afterRender(); btn.focus({preventScroll:true});
  });
}

function askQuiz(head, who, lead, id, done){
  if(QB[id].ord) return askOrder(head, who, lead, id, done);
  const q = QB[id]; const order = shuffled(q.o.length);
  S.met[who] = 1;
  const pre = lead ? lead+"\n" : "";
  show(`${head}${speaker(who, pre + q.q)}<div class="opts">${order.map(k=>`<button class="opt" data-k="${k}">${esc(q.o[k])}</button>`).join("")}</div>`);
  V().querySelectorAll(".opt").forEach(b => b.onclick = () => {
    const k = +b.dataset.k, ok = k===q.a;
    V().querySelectorAll(".opt").forEach(x => { x.disabled = true; const kk=+x.dataset.k; if(kk===q.a) x.classList.add("right"); else if(x===b) x.classList.add("wrong"); });
    S.total++; if(ok) S.right++; worldReact(ok);
    S.cards[id] = 1;
    addLog(`${ok?"✓":"✗"} ${q.t}`);
    const fx = applyFx(ok ? {know:4, mood:2, hours:0.5} : {know:1, hp:-8, mood:-3, hours:0.5});
    const fb = document.createElement("div");
    fb.className = "feedback" + (ok ? "" : " bad");
    fb.innerHTML = `<span class="stamp ${ok?"ok":""}">${ok?"答對":"再想想"}</span><strong>${esc(q.t)}</strong><span>${esc(q.e)}<a class="ref" href="#ref-${q.ref}" data-ref="${q.ref}">[${q.ref}]</a></span><span class="src">參考文獻 [${q.ref}]：${esc(q.s)}</span>${studyLinks(id)}<span class="fx">${fx}　｜已收入知識卡</span>`;
    const btn = document.createElement("button"); btn.className="primary"; btn.textContent="繼續"; btn.dataset.auto = "1";
    btn.onclick = () => done(ok);
    V().append(fb, btn); renderSide(); save(); afterRender(); btn.focus({preventScroll:true});
  });
}

function runBoss(head, s){
  let i = 0, score = 0;
  const intro = () => {
    show(`${head}<span class="stamp">關主</span>${speaker(s.who, s.intro)}<button class="primary" id="nx">接受挑戰</button>`);
    document.getElementById("nx").onclick = ask;
  };
  const ask = () => {
    if(i >= s.ids.length) return result();
    askQuiz("", s.who, `（第 ${i+1}／${s.ids.length} 題）`, s.ids[i], ok => { if(ok) score++; i++; ask(); });
  };
  const result = () => {
    const win = score >= s.pass;
    const fx = applyFx(win ? {know:5, mood:6} : {mood:-4}, win ? s.rel : {});
    addLog(`關主 ${CH[s.who].n}：${win?"過關":"補強"}（${score}/${s.ids.length}）`);
    show(`<span class="stamp ${win?"ok":""}">${win?"過關":"補強"}</span>${speaker(s.who, win ? s.win : s.lose)}<p class="fx">答對 ${score}／${s.ids.length}　${fx}</p>${nxBtn()}`);
    document.getElementById("nx").onclick = next;
  };
  intro();
}

function pickElective(st){
  if(S.electCount === undefined || S.electStage !== S.stage){ S.electCount = 0; S.electStage = S.stage; }
  const avail = Object.entries(ELECTIVES).filter(([k]) => !S.electDone.includes(k));
  show(`${S.electCount===0?stageBanner(st):""}${speaker("sys", `選擇第 ${S.electCount+1} 個選修科（共選 ${st.elective} 科）。PGY1 選修每月選一科、不可重複同科。[[mohw]]`)}
   <div class="opts">${avail.map(([k,e])=>`<button class="opt" data-k="${k}">${esc(e.n)}</button>`).join("")}</div>`);
  V().querySelectorAll(".opt").forEach(b => b.onclick = () => {
    const k = b.dataset.k; S.electDone.push(k); S.electCount++; S.electQueue = [k]; S.step = st.steps.length;
    addLog(`選修：${ELECTIVES[k].n}`); save(); run();
  });
}

function endStage(){
  const st = STAGES[S.stage];
  if(st.m){ S.hourLog.push({lab:st.dept.replace("一般醫學",""), h:S.hours}); addLog(`完成 ${st.dept}（${st.m} 個月）`); }
  S.month += st.m;
  const rest = st.m ? applyFx({hp:25, mood:5}) : "";
  S.hours = 230;
  S.stage++; S.step = 0; S.electQueue = null;
  const nx = STAGES[S.stage];
  if(!nx) return ending();
  if(st.m === 0){ return run(); }
  show(`<div class="banner"><span class="eyebrow">輪訓結束 · ${S.month}/24 個月</span><h2>${esc(st.dept)} 完成</h2></div>
   <p>換科前休了一天假，四週工時重新起算。人生地圖又填滿了 ${st.m} 格。</p><p class="fx">${rest}</p>${nxBtn("前往：" + nx.dept)}`);
  document.getElementById("nx").onclick = run;
}

function yearEnd(){

  const pct = S.total ? S.right/S.total : 0;

let audio = null;
document.getElementById("music").onclick = e => {
  const btn = e.currentTarget;
  if(audio){ audio.ctx.close(); audio = null; btn.setAttribute("aria-pressed", false); return; }
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const master = ctx.createGain(); master.gain.value = 0.035; master.connect(ctx.destination);
    const chords = [[261.63,329.63,392],[220,261.63,329.63],[174.61,220,261.63],[196,246.94,293.66]];
    let i = 0;
    const play = () => {
      const t = ctx.currentTime;
      chords[i++ % chords.length].forEach(f => {
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = "sine"; o.frequency.value = f/2;
        g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(1, t+1.2); g.gain.linearRampToValueAtTime(0, t+4.2);
        o.connect(g); g.connect(master); o.start(t); o.stop(t+4.3);
      });
    };
    play(); const timer = setInterval(play, 4000);
    audio = {ctx, timer}; ctx.addEventListener("statechange", () => { if(ctx.state==="closed") clearInterval(timer); });
    btn.setAttribute("aria-pressed", true);

function drawChar(c, x, y, id, dir="down", frame=0, s=2){
  const L = LOOK[id] || LOOK.pt;
  const r = (a,b,w,h,col) => { c.fillStyle = col; c.fillRect(x + a*s, y + b*s, w*s, h*s); };
  c.fillStyle = "rgba(0,0,0,.18)"; c.beginPath(); c.ellipse(x+8*s, y+19.5*s, 6*s, 1.6*s, 0, 0, 7); c.fill();
  const step = frame%2 ? 1 : 0, bob = frame%2 ? -0.5 : 0;
  r(4, 15, 3, 4 - step, "#2e3a40"); r(9, 15, 3, 3 + step, "#2e3a40");
  r(3, 8+bob, 10, 8, L.coat); r(6.5, 8+bob, 3, 7, L.shirt);
  if(L.coat === "#f4f6f5"){ r(3, 8+bob, 10, .6, "#d5dbd8"); r(10, 11+bob, 2, 1.5, "#9aa"); }
  r(1.6, 9+bob + (dir==="left"||dir==="right" ? 0 : step), 1.6, 5, L.coat); r(12.8, 9+bob + (dir==="left"||dir==="right" ? 0 : 1-step), 1.6, 5, L.coat);
  r(1.6, 13.6+bob, 1.6, 1.2, L.skin); r(12.8, 13.6+bob, 1.6, 1.2, L.skin);
  r(4, 1+bob, 8, 7, L.skin);
  const h = L.hair;
  if(L.style==="cap"){ r(3.4, 0+bob, 9.2, 3, h); r(3.4, 3+bob, 1, 1.4, h); r(11.6, 3+bob, 1, 1.4, h); }
  else {
    r(3.6, 0+bob, 8.8, 2.6, h);
    if(dir==="up") r(3.6, 2+bob, 8.8, 5, h);
    if(L.style==="spiky"){ r(4, -0.8+bob, 1.5, 1, h); r(7, -1+bob, 1.5, 1.2, h); r(10, -0.8+bob, 1.5, 1, h); }
    if(L.style==="long"){ r(3, 2+bob, 1.4, 8, h); r(11.6, 2+bob, 1.4, 8, h); }
    if(L.style==="bob"){ r(3, 2+bob, 1.6, 5, h); r(11.4, 2+bob, 1.6, 5, h); }
    if(L.style==="bun"){ r(6.5, -2+bob, 3, 2.2, h); r(3.4, 2+bob, 1, 2, h); r(11.6, 2+bob, 1, 2, h); }
    if(L.style==="pony"){ r(3.4, 2+bob, 1, 2, h); r(11.6, 2+bob, 1, 2, h); if(dir!=="down") r(dir==="left"?11.8:2.2, 3+bob, 1.8, 5, h); else r(12, 2.4+bob, 1.4, 4, h); }
    if(L.style==="short"){ r(3.4, 2+bob, 1, 2, h); r(11.6, 2+bob, 1, 2, h); }
  }
  if(dir!=="up"){
    const dx = dir==="left" ? -1 : dir==="right" ? 1 : 0;
    r(5.8+dx, 4.4+bob, 1.2, 1.4, "#222"); r(9+dx, 4.4+bob, 1.2, 1.4, "#222");
    if(L.glasses){ r(5+dx, 4+bob, 2.8, .5, "#555"); r(8.2+dx, 4+bob, 2.8, .5, "#555"); }
    r(7+dx, 6.6+bob, 2, .6, "#b4685a");
  }
}
const PORTRAIT = {};

  if(PORTRAIT[id]) return PORTRAIT[id];

const SPOTS = [[4,4],[9,5],[12,4],[6,6],[2,4],[11,6],[7,4],[13,5],[5,5],[10,3],[3,6],[8,6]];
const W = {key:null, theme:"lobby", items:[], block:new Set(), npcs:[], walkers:[], p:{x:7,y:6,fx:7,fy:6,dir:"up",path:[],moving:0},
  target:null, onArrive:null, lastWho:null, bubbles:[], parts:[], shake:0, fade:0, title:"", t:0, raf:0, cv:null};
function blocked(x,y){ return x<0||y<0||x>=COLS||y>=ROWS||W.block.has(x+","+y)||W.npcs.some(n=>n.x===x&&n.y===y); }
function buildBlock(){
  W.block = new Set();
  for(let x=0;x<COLS;x++){ W.block.add(x+",0"); }
  W.items.forEach(f => {
    if(f.k==="path"||f.k==="sign"||f.k==="lamp") return;
    const w = f.w || (f.k==="bed"||f.k==="resus"||f.k==="cot"?2:f.k==="ortable"?3:f.k==="house"?4:1);
    const h = f.k==="bed"||f.k==="resus"||f.k==="cot"||f.k==="house"?2:1;
    if(f.k==="door") return;
    for(let i=0;i<w;i++) for(let j=0;j<h;j++) W.block.add((f.x+i)+","+(f.y+j));
  });
}
function stageWhos(){
  if(!S || S.stage<0) return ["zhang","rui","kui","ouyang","bai","hsu","lin"];
  const st = STAGES[S.stage]; if(!st) return [];

  return out.slice(0, SPOTS.length);

function worldSync(){

function npcOf(id){
  let n = W.npcs.find(n => n.id===id);
  if(!n){
    const spot = SPOTS.find(([x,y]) => !blocked(x,y) && !(W.p.x===x && W.p.y===y)) || [7,4];
    n = {id, x:spot[0], y:spot[1], dir:"down", ph:0}; W.npcs.push(n);
  }
  return n;
}
function bfs(sx,sy,goals){
  const k = (x,y) => x+","+y, prev = new Map([[k(sx,sy),null]]), q = [[sx,sy]];
  while(q.length){
    const [x,y] = q.shift();
    if(goals.some(([gx,gy]) => gx===x && gy===y)){
      const path = []; let cur = k(x,y);
      while(cur && cur !== k(sx,sy)){ const [a,b] = cur.split(",").map(Number); path.unshift([a,b]); cur = prev.get(cur); }
      return path;
    }
    for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
      const nx = x+dx, ny = y+dy, kk = k(nx,ny);
      if(!prev.has(kk) && !blocked(nx,ny)){ prev.set(kk, k(x,y)); q.push([nx,ny]); }
    }
  }
  return null;
}
function walkTo(n, then){
  const goals = [[n.x,n.y+1],[n.x-1,n.y],[n.x+1,n.y],[n.x,n.y-1]];
  if(goals.some(([x,y]) => x===W.p.x && y===W.p.y)){ face(n); return then && then(); }
  const path = bfs(W.p.x, W.p.y, goals);
  W.p.path = path || []; W.onArrive = () => { face(n); then && then(); };
  if(!path || !path.length){ const f = W.onArrive; W.onArrive = null; f(); }
}
function face(n){
  const dx = n.x - W.p.x, dy = n.y - W.p.y;
  W.p.dir = Math.abs(dx) > Math.abs(dy) ? (dx>0?"right":"left") : (dy>0?"down":"up");
  n.dir = {left:"right", right:"left", up:"down", down:"up"}[W.p.dir];
}
function bubble(n, text, t=2.6){ W.bubbles = W.bubbles.filter(b => b.n!==n); W.bubbles.push({n, text, t}); }

function gate(who, head, go){

  const n = npcOf(who); W.target = who;
  let done = false;
  const fire = () => { if(done) return; done = true; W.target = null; W.lastWho = who; bubble(n, "……", 1.2); go(); };
  W.fire = () => walkTo(n, fire);
  const c = CH[who];
  show(`${head}<div class="gate"><img class="pav" src="${portrait(who)}" alt=""><div><strong>${esc(c.n)}</strong>在等你（頭上有「！」）。<span class="meta">用方向鍵或 WASD 走過去按空白鍵，也可以直接點地圖上的人物。</span></div></div><button class="primary" id="nx" data-auto="1">走過去說話</button>`);

}

/* 繪製 */
function drawItem(c, f){
  const X = f.x*TW, Y = f.y*TW, r = (x,y,w,h,col) => { c.fillStyle = col; c.fillRect(X+x, Y+y, w, h); };
  const z = Math.sin(W.t*2)*2;
  switch(f.k){
    case "bed": case "cot": case "resus":
      r(2,4,TW*2-4,TW*2-10, f.k==="resus" ? "#c8d2da" : "#fafafa"); r(2,4,TW*2-4,6,"#9fb4c2");

      drawHead(c, X+17, Y+13); if(f.k!=="resus"){ c.fillStyle="#6b7c86"; c.font="bold 11px sans-serif"; c.fillText("z", X+34, Y+8+z); }
      if(f.k==="resus"){ r(TW*2-12,0,10,10,"#222"); c.strokeStyle="#4ef08a"; c.beginPath(); for(let i=0;i<9;i++){ const yy = (i===4? -3 : i===5 ? 3 : 0); c.lineTo(X+TW*2-12+i, Y+5+yy); } c.stroke(); }
      break;
    case "crib": r(4,8,24,18,"#f6efe4"); r(4,8,24,3,"#c79a6a"); drawHead(c, X+12, Y+12, 0.7); break;
    case "desk": r(0,8,(f.w||1)*TW,TW-8,"#b98b5e"); r(0,8,(f.w||1)*TW,5,"#d3a679"); r(8,0,14,10,"#33424c"); r(10,2,10,6,"#7fd0e0");
      if(f.t){ c.fillStyle="#fff"; c.font="bold 11px sans-serif"; c.fillText(f.t, X+30, Y+26); } break;
    case "sign": r(0,2,(f.w||1)*TW,22,"#2c6e5c"); c.fillStyle="#fff"; c.font="bold 13px sans-serif"; c.textAlign="center"; c.fillText(f.t, X+(f.w||1)*TW/2, Y+18); c.textAlign="left"; break;
    case "chair": r(6,10,20,14,"#4a7c9a"); r(6,6,20,6,"#3b6680"); break;
    case "plant": r(10,18,12,12,"#b06a3b"); c.fillStyle="#3f8f4a"; c.beginPath(); c.arc(X+16,Y+14+z*.3,10,0,7); c.fill(); break;
    case "door": r(0,TW-6,TW,6,"#7a8a94"); if(f.t){ c.fillStyle="#a3342e"; c.font="bold 10px sans-serif"; c.fillText(f.t, X-14, Y+12); } break;
    case "cart": r(4,6,24,20,"#c8483f"); r(4,6,24,4,"#e0675e"); r(6,26,4,4,"#333"); r(22,26,4,4,"#333"); break;
    case "sink": r(4,6,24,16,"#cfd8dc"); r(10,10,12,8,"#9ec5d6"); break;
    case "ortable": r(0,8,TW*3,16,"#5f8f9a"); r(4,10,TW*3-8,12,"#89b8c2"); break;
    case "lamp": c.fillStyle="rgba(255,250,210,.55)"; c.beginPath(); c.ellipse(X+48,Y+28,40,12,0,0,7); c.fill(); r(40,0,16,8,"#ddd"); break;
    case "monitor": r(4,2,24,18,"#222"); r(6,4,20,14,"#103"); c.strokeStyle="#4ef08a"; c.beginPath(); for(let i=0;i<20;i++){ c.lineTo(X+6+i, Y+11 + ((i+Math.floor(W.t*12))%10===0 ? -5 : 0)); } c.stroke(); break;
    case "toy": r(6,14,10,10,"#e05a47"); r(16,18,10,8,"#3b8bd0"); r(10,8,8,8,"#f2c230"); break;
    case "house": r(0,10,TW*4,TW*2-10,"#efe6d2"); c.fillStyle="#b2513b"; c.beginPath(); c.moveTo(X-4,Y+12); c.lineTo(X+TW*2,Y-6); c.lineTo(X+TW*4+4,Y+12); c.fill();
      r(TW*2-8,TW*2-22,16,22,"#7a5a3a"); c.fillStyle="#2c6e5c"; c.font="bold 12px sans-serif"; c.fillText(f.t, X+18, Y+30); break;
    case "tree": r(12,18,8,14,"#7a5432"); c.fillStyle="#3d7f3a"; c.beginPath(); c.arc(X+16,Y+12,14,0,7); c.fill(); break;
    case "shelf": r(0,0,(f.w||1)*TW,TW,"#8a6542"); for(let i=0;i<9;i++) r(4+i*10,6,7,20,["#c8483f","#3b8bd0","#f2c230","#2c6e5c"][i%4]); break;
  }
}
function drawHead(c, x, y, s=1){ c.fillStyle="#eac29c"; c.fillRect(x, y, 12*s, 10*s); c.fillStyle="#5b4a3f"; c.fillRect(x, y, 12*s, 3*s); }
function drawWorld(){
  const cv = W.cv, c = cv.getContext("2d");
  c.save();
  if(W.shake > 0) c.translate((Math.random()-.5)*8, 0);
  const [a,b] = FLOOR[W.theme];
  for(let y=0;y<ROWS;y++) for(let x=0;x<COLS;x++){ c.fillStyle = (x+y)%2 ? a : b; c.fillRect(x*TW, y*TW, TW, TW); }
  if(W.theme==="village"){ c.fillStyle="#d8c39a"; c.fillRect(0, 5*TW, COLS*TW, TW); c.fillRect(6*TW, 3*TW, TW, 6*TW); }
  else { c.fillStyle = "#b9c4c2"; c.fillRect(0,0,COLS*TW,TW); c.fillStyle="#a7b3b1"; c.fillRect(0,TW-4,COLS*TW,4); }
  W.items.forEach(f => drawItem(c, f));
  const actors = [...W.npcs.map(n => ({id:n.id, x:n.x, y:n.y, dir:n.dir, frame:Math.floor((W.t+n.ph)*1.5)%2 && 0, npc:n})),
    ...W.walkers.map(w => ({id:w.id, x:w.fx, y:w.fy, dir:w.dir, frame:w.path.length ? Math.floor(W.t*8) : 0})),
    {id:"me", x:W.p.fx, y:W.p.fy, dir:W.p.dir, frame:W.p.path.length ? Math.floor(W.t*8) : 0, me:1}].sort((p,q) => p.y-q.y);
  actors.forEach(a => {
    const bx = a.x*TW, by = a.y*TW - 10 + (a.npc ? Math.sin(W.t*2+a.npc.ph)*1 : 0);
    drawChar(c, bx, by, a.id, a.dir, a.frame, 2);
    if(a.npc){
      const nm = CH[a.id].n.replace(/（.*）/,"");
      c.font = "11px sans-serif"; const w = c.measureText(nm).width + 8;
      c.fillStyle = "rgba(255,255,255,.85)"; c.fillRect(bx+16-w/2, by+42, w, 13);
      c.fillStyle = "#223"; c.textAlign = "center"; c.fillText(nm, bx+16, by+52); c.textAlign = "left";
      if(W.target === a.id){
        const jy = by - 14 + Math.sin(W.t*6)*3;
        c.fillStyle = "#f2b630"; c.fillRect(bx+10, jy, 12, 14); c.fillStyle = "#222"; c.font = "bold 12px sans-serif"; c.textAlign = "center"; c.fillText("！", bx+16, jy+12); c.textAlign = "left";
      }
    }
  });
  W.bubbles.forEach(b => {
    const bx = b.n.x*TW+16, by = b.n.y*TW - 22; c.font = "12px sans-serif";
    const w = Math.min(220, c.measureText(b.text).width + 14);
    const x0 = Math.max(4, Math.min(COLS*TW - w - 4, bx - w/2));
    c.fillStyle = "#fff"; c.strokeStyle = "#334"; c.lineWidth = 1.5; c.beginPath(); c.roundRect ? c.roundRect(x0, by-18, w, 20, 6) : c.rect(x0, by-18, w, 20); c.fill(); c.stroke();
    c.fillStyle = "#223"; c.fillText(b.text.length > 18 ? b.text.slice(0,17)+"…" : b.text, x0+7, by-4);
  });
  W.parts.forEach(p => { c.globalAlpha = Math.max(0,p.t); c.fillStyle = p.col; c.fillRect(p.x, p.y, 5, 5); }); c.globalAlpha = 1;
  c.fillStyle = "rgba(20,30,34,.72)"; c.font = "bold 12px sans-serif"; const tw = c.measureText(W.title).width + 16; c.fillRect(6, 6, tw, 20); c.fillStyle="#fff"; c.fillText(W.title, 14, 20);
  if(W.fade > 0){ c.fillStyle = `rgba(10,16,18,${W.fade})`; c.fillRect(0,0,cv.width,cv.height); c.fillStyle = `rgba(255,255,255,${W.fade})`; c.font = "bold 20px sans-serif"; c.textAlign="center"; c.fillText(W.title, cv.width/2, cv.height/2); c.textAlign="left"; }
  c.restore();
}
function tick(dt){
  W.t += dt;
  const sp = REDUCED ? 99 : 7;
  const p = W.p;
  if(p.path.length){
    const [tx,ty] = p.path[0];
    p.dir = tx>p.x ? "right" : tx<p.x ? "left" : ty>p.y ? "down" : "up";
    const dx = tx - p.fx, dy = ty - p.fy, d = Math.hypot(dx,dy), m = sp*dt;
    if(d <= m){ p.fx = p.x = tx; p.fy = p.y = ty; p.path.shift(); if(!p.path.length && W.onArrive){ const f = W.onArrive; W.onArrive = null; f(); } }
    else { p.fx += dx/d*m; p.fy += dy/d*m; }
  }
  W.walkers.forEach(w => {
    if(w.path.length){ const [tx,ty] = w.path[0]; w.dir = tx>w.fx?"right":tx<w.fx?"left":ty>w.fy?"down":"up";
      const dx=tx-w.fx, dy=ty-w.fy, d=Math.hypot(dx,dy), m=1.6*dt; if(d<=m){ w.fx=tx; w.fy=ty; w.path.shift(); } else { w.fx+=dx/d*m; w.fy+=dy/d*m; } }
    else if((w.wait -= dt) < 0){
      w.wait = 2 + Math.random()*3; const gx = 1+Math.floor(Math.random()*13), gy = 2+Math.floor(Math.random()*6);
      if(!blocked(gx,gy)){ const path = (() => { const tmp = {x:Math.round(w.fx), y:Math.round(w.fy)}; return bfs(tmp.x, tmp.y, [[gx,gy]]); })(); w.path = (path||[]).slice(0,6); }
    }
  });
  W.npcs.forEach(n => { if(n.id !== W.target && Math.random() < dt*.15) n.dir = ["down","left","right","down"][Math.floor(Math.random()*4)]; });
  W.bubbles.forEach(b => b.t -= dt); W.bubbles = W.bubbles.filter(b => b.t > 0);
  W.parts.forEach(q => { q.x += q.vx*dt; q.y += q.vy*dt; q.vy += 260*dt; q.t -= dt*1.2; }); W.parts = W.parts.filter(q => q.t > 0);
  if(W.shake > 0) W.shake -= dt;
  if(W.fade > 0) W.fade = Math.max(0, W.fade - dt*(REDUCED ? 9 : 0.9));
}
function worldInit(){
  const wrap = document.getElementById("world"), cv = document.getElementById("map");
  if(!cv || !cv.getContext) return;
  W.cv = cv; cv.width = COLS*TW; cv.height = ROWS*TW;
  worldSync();
  let last = performance.now();
  const loop = now => {
    const dt = Math.min(.05, (now-last)/1000); last = now;
    const hide = V().hidden; if(wrap.hidden !== hide) wrap.hidden = hide;
    if(!hide){ tick(dt); drawWorld(); }
    W.raf = requestAnimationFrame(loop);
  };
  W.raf = requestAnimationFrame(loop);
  const tapTile = e => {
    const r = cv.getBoundingClientRect();
    return [Math.floor((e.clientX - r.left) / r.width * COLS), Math.floor((e.clientY - r.top + 10*r.height/cv.height) / r.height * ROWS)];
  };
  cv.addEventListener("click", e => {
    const [x,y] = tapTile(e);
    const n = W.npcs.find(n => n.x===x && (n.y===y || n.y===y+1));
    if(n){
      if(n.id === W.target && W.fire) return W.fire();
      return walkTo(n, () => bubble(n, idleLine(n.id)));
    }
    if(!blocked(x,y)){ const path = bfs(W.p.x, W.p.y, [[x,y]]); if(path){ W.p.path = path; W.onArrive = null; } }
  });
  document.addEventListener("keydown", e => {
    if(V().hidden || /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
    const d = {ArrowUp:[0,-1,"up"],KeyW:[0,-1,"up"],ArrowDown:[0,1,"down"],KeyS:[0,1,"down"],ArrowLeft:[-1,0,"left"],KeyA:[-1,0,"left"],ArrowRight:[1,0,"right"],KeyD:[1,0,"right"]}[e.code];
    if(d){
      e.preventDefault(); W.p.dir = d[2];
      if(!W.p.path.length && !blocked(W.p.x+d[0], W.p.y+d[1])) W.p.path = [[W.p.x+d[0], W.p.y+d[1]]];
      return;
    }
    if(e.code==="Space" && !(e.target.closest && e.target.closest("button"))){
      const [fx,fy] = {up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]}[W.p.dir];
      const near = W.npcs.filter(n => Math.abs(n.x-W.p.x)+Math.abs(n.y-W.p.y)===1);
      const n = near.find(n => n.x===W.p.x+fx && n.y===W.p.y+fy) || near.find(n => n.id===W.target) || near[0];
      if(n){ e.preventDefault(); face(n); if(n.id===W.target && W.fire) W.fire(); else bubble(n, idleLine(n.id)); }
    }
  });
}
function idleLine(id){
  const lines = {zhang:"病人不會等你準備好。", ouyang:"交班單 NPO 那欄寫了沒？", lin:"手部衛生五時機，背一次。", kui:"給藥前我會再核對一次喔。", rui:"叫我護理師就好。",
    wang:"急診的夜很長，記得喝水。", lee:"小朋友不是縮小版的大人。", tsai:"先驗孕，再說別的。", kolas:"醫療不只在醫院裡。", shih:"先跟阿公平視再說話。",
    cheng:"開藥前先查腎功能。", hsu:"……應該沒事吧？開玩笑的。", bai:"這週的班我們重新排過了。"};
  return lines[id] || "你好。";
}

/* ======================= 啟動 ======================= */
function resume(d){
  S = d;
  if(S.stage >= STAGES.length && S.spec) return finalScreen();
  run();
}
function start(){ S = null; titleScreen(); }
worldInit();
window.claude?.hot?.snapshot?.(() => ({S}));
if(window.claude?.hot?.ready){ window.claude.hot.ready(d => { if(d && d.S){ resume(d.S); } else start(); }); }
else { const d = window.claude?.hot?.data; if(d && d.S){ resume(d.S); } else start(); }
</script>
